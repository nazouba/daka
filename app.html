  updateImportFormat(){
    const fmt=document.getElementById('kb-import-format').value;
    const hint=document.getElementById('kb-import-hint');
    const ta=document.getElementById('kb-import-text');
    const hints={
      json:`<b>JSON 数组格式</b> — 每个对象包含 subject/grade/lessonNumber/lessonTitle/title/content/tags<br>示例：<code style="font-size:11px">[{"subject":"chinese","grade":3,"lessonNumber":1,"lessonTitle":"登鹳雀楼","title":"作者","content":"王之涣，唐代","tags":"古诗,作者"}]</code>`,
      csv:`<b>CSV 逗号分隔格式</b> — 首行可选表头，之后每行一个知识点：<br><code style="font-size:11px">学科,年级,课次,课文标题,知识点标题,知识点正文,标签</code><br>学科：chinese/math/english/science<br>含逗号的字段用双引号包裹，如 <code>"王之涣，唐代诗人"</code><br>示例：<code style="font-size:11px">chinese,3,1,登鹳雀楼,作者,"王之涣，唐代",古诗</code>`,
      tsv:`<b>Tab 制表符分隔格式</b> — 从 Excel 选中单元格直接 Ctrl+C 复制即可粘贴：<br>每行一个知识点，字段顺序：<code>学科  年级  课次  课文标题  知识点标题  知识点正文  标签</code><br>学科：chinese/math/english/science`,
      text:`<b>纯文本逐行格式</b> — 最简单，每行一个知识点：<br>格式：<code>K 学科 年级 课次 课文标题 知识点标题 知识点正文 标签</code><br>学科：chinese/math/english/science<br>每个字段之间用空格或全角空格分隔；字段含空格时用方括号 [ ] 包裹<br>示例：<code style="font-size:11px">K chinese 3 1 登鹳雀楼 作者 [王之涣，唐代诗人] 古诗,作者</code>`
    };
    hint.innerHTML=hints[fmt]||'';
    const placeholders={
      json:'[{"subject":"chinese","grade":3,"lessonNumber":1,"lessonTitle":"登鹳雀楼","title":"作者","content":"王之涣唐代","tags":"古诗"}]',
      csv:'chinese,3,1,登鹳雀楼,作者,"王之涣，唐代诗人",古诗\nmath,3,1,加法交换律,"a+b=b+a，两个数相加","交换加数位置和不变",运算律',
      tsv:'chinese\t3\t1\t登鹳雀楼\t作者\t王之涣唐代\t古诗\nmath\t3\t1\t加法交换律\ta+b=b+a\t交换加数位置和不变\t运算律',
      text:'K chinese 3 1 登鹳雀楼 作者 [王之涣，唐代诗人] 古诗,作者\nK math 3 1 加法交换律 [a+b=b+a] 运算律'
    };
    ta.placeholder=placeholders[fmt]||'';
  },
  downloadTemplate(){
    const fmt=document.getElementById('kb-import-format')?.value||'json';
    let content='',filename='',mime='text/plain';
    if(fmt==='json'){
      content=JSON.stringify([
        {subject:'chinese',grade:3,lessonNumber:1,lessonTitle:'登鹳雀楼',title:'作者与朝代',content:'王之涣，唐代诗人',tags:'古诗,作者'},
        {subject:'math',grade:3,lessonNumber:1,lessonTitle:'加法运算律',title:'加法交换律',content:'a+b=b+a，两个数相加交换加数位置，和不变',tags:'运算律,重要'},
      ],null,2);
      filename='知识库模板_JSON.json';mime='application/json';
    }else if(fmt==='csv'){
      content='学科,年级,课次,课文标题,知识点标题,知识点正文,标签\nchinese,3,1,登鹳雀楼,作者与朝代,"王之涣，唐代诗人",古诗\nmath,3,1,加法运算律,加法交换律,"a+b=b+a，交换加数位置和不变",运算律\n';
      filename='知识库模板_CSV.csv';mime='text/csv';
    }else if(fmt==='tsv'){
      content='学科\t年级\t课次\t课文标题\t知识点标题\t知识点正文\t标签\nchinese\t3\t1\t登鹳雀楼\t作者与朝代\t王之涣唐代诗人\t古诗\nmath\t3\t1\t加法运算律\t加法交换律\ta+b=b+a交换加数位置和不变\t运算律\n';
      filename='知识库模板_TSV.txt';mime='text/plain';
    }else{
      content='K chinese 3 1 登鹳雀楼 作者与朝代 [王之涣，唐代诗人] 古诗,作者\nK math 3 1 加法运算律 加法交换律 [a+b=b+a，交换加数位置和不变] 运算律\n';
      filename='知识库模板_纯文本.txt';mime='text/plain';
    }
    const blob=new Blob([content],{type:mime+';charset=utf-8'});

    const a=document.createElement('a');a.href=url;a.download=filename;a.click();
    URL.revokeObjectURL(url);
    App.Utils.toast('模板已下载','success');
  },
  doImport(){
    const fmt=document.getElementById('kb-import-format').value;
    const txt=document.getElementById('kb-import-text').value.trim();
    const lessonId=document.getElementById('kb-import-lesson').value;
    if(!txt){App.Utils.toast('请粘贴数据','error');return;}
    let points=[];
    try{
      if(fmt==='json')points=this.parseJsonImport(txt);
      else if(fmt==='csv')points=this.parseCsvImport(txt);
      else if(fmt==='tsv')points=this.parseTsvImport(txt);
      else points=this.parseTextImport(txt);
    }catch(e){App.Utils.toast('解析失败：'+e.message,'error');return;}
    if(points.length===0){App.Utils.toast('未解析到有效数据','error');return;}
    const bank=App.DataStore.getKnowledgeBase();
    let imported=0;
    points.forEach(p=>{
      if(!p.title||!p.content)return;
      const subject=p.subject||this.currentSubject;
      if(!bank.subjects[subject])return;
      let lesson=null;
      if(lessonId){
        for(const s of Object.values(bank.subjects)){
          const l=s.lessons.find(x=>x.lessonId===lessonId);
          if(l){lesson=l;break;}
        }
      }
      if(!lesson){
        const grade=parseInt(p.grade)||1;
        const lessonNumber=parseInt(p.lessonNumber)||1;
        lesson=App.DataStore.findOrCreateKnowledgeLesson(bank,subject,grade,lessonNumber,p.lessonTitle||('第'+lessonNumber+'课'));
      }
      const now=Date.now();
      lesson.points.push({pointId:App.Utils.genId('kp'),title:p.title,content:p.content,tags:p.tags||'',createdAt:now,updatedAt:now});
      imported++;
    });
    App.DataStore.saveKnowledgeBase(bank);
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast('成功导入 '+imported+' 个知识点','success');
  },
  parseJsonImport(txt){
    const arr=JSON.parse(txt);
    if(!Array.isArray(arr))throw new Error('JSON 必须是数组');
    return arr.map(o=>({subject:o.subject,grade:o.grade,lessonNumber:o.lessonNumber,lessonTitle:o.lessonTitle,title:o.title,content:o.content,tags:o.tags}));
  },
  parseCsvImport(txt){
    const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length===0)return [];
    /* 检测是否有表头 */
    const firstCells=this.parseCsvLine(lines[0]);
    let startIdx=0;
    if(isNaN(parseInt(firstCells[1]))){startIdx=1;} /* 第二列是年级，非数字则为表头 */
    const result=[];
    for(let i=startIdx;i<lines.length;i++){
      const cells=this.parseCsvLine(lines[i]);
      if(cells.length<6)continue;
      result.push({subject:cells[0].trim(),grade:cells[1].trim(),lessonNumber:cells[2].trim(),lessonTitle:cells[3].trim(),title:cells[4].trim(),content:cells[5].trim(),tags:(cells[6]||'').trim()});
    }
    return result;
  },
  parseCsvLine(line){
    const cells=[];let cur='',inQuote=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){if(inQuote&&line[i+1]==='"'){cur+='"';i++;}else{inQuote=!inQuote;}}
      else if(ch===','&&!inQuote){cells.push(cur);cur='';}
      else{cur+=ch;}
    }
    cells.push(cur);
    return cells;
  },
  parseTsvImport(txt){
    const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length===0)return [];
    let startIdx=0;
    const firstCells=lines[0].split('\t');
    if(isNaN(parseInt(firstCells[1])))startIdx=1;
    const result=[];
    for(let i=startIdx;i<lines.length;i++){
      const cells=lines[i].split('\t');
      if(cells.length<6)continue;
      result.push({subject:cells[0].trim(),grade:cells[1].trim(),lessonNumber:cells[2].trim(),lessonTitle:cells[3].trim(),title:cells[4].trim(),content:cells[5].trim(),tags:(cells[6]||'').trim()});
    }
    return result;
  },
  parseTextImport(txt){
    /* 先把方括号内的换行替换为特殊占位符，避免按行拆分时断裂 */
    const NL_PLACEHOLDER='__NL__';
    let processed='';
    let inBracket=false;
    for(let i=0;i<txt.length;i++){
      const ch=txt[i];
      if(ch==='['){inBracket=true;processed+=ch;}
      else if(ch===']'){inBracket=false;processed+=ch;}
      else if(inBracket&&(ch==='\n'||ch==='\r')){processed+=NL_PLACEHOLDER;}
      else{processed+=ch;}
    }
    const lines=processed.split(/\r?\n/).filter(l=>l.trim());
    const result=[];
    lines.forEach(line=>{
      line=line.trim();
      if(!line.startsWith('K')&&!line.startsWith('k'))return;
      const rest=line.substring(1).trim();
      const fields=App.QuestionBank.splitTextFields(rest);
      if(fields.length<6)return;
      /* 还原占位符为换行 */
      result.push({subject:fields[0],grade:fields[1],lessonNumber:fields[2],lessonTitle:fields[3],title:fields[4],content:fields[5].replace(new RegExp(NL_PLACEHOLDER,'g'),'\n'),tags:fields[6]||''});
    });
    return result;
  },

  /* ---------- 导出 ---------- */
  exportSubject(){
    const bank=App.DataStore.getKnowledgeBase();
    const subj=bank.subjects[this.currentSubject];
    if(!subj||subj.lessons.length===0){App.Utils.toast('当前学科无课文可导出','error');return;}
    const exportData=subj.lessons.map(l=>({
      subject:this.currentSubject,grade:l.grade,lessonNumber:l.lessonNumber,
      lessonTitle:l.lessonTitle,points:l.points.map(p=>({title:p.title,content:p.content,tags:p.tags}))
    }));
    const blob=new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=this.currentSubject+'_knowledge_'+App.Utils.todayStr()+'.json';a.click();
    URL.revokeObjectURL(url);
    App.Utils.toast('已导出 '+subj.lessons.length+' 篇课文','success');
  },

  /* ---------- 教材版本 ---------- */
  openEditTextbookDialog(){
    if(!App.ParentPanel.checkAuth()){App.ParentPanel.showLoginDialog();return;}
    const bank=App.DataStore.getKnowledgeBase();
    App.Renderer.openModal(`
      <h3>📖 修改教材版本</h3>
      ${Object.entries(bank.subjects).map(([k,s])=>`<div class="form-group"><label>${s.name}</label><input type="text" id="tb-${k}" value="${App.Utils.escape(s.textbook)}"></div>`).join('')}
      <div class="modal-actions"><button class="btn btn-secondary" onclick="App.Renderer.closeModal()">取消</button><button class="btn btn-primary" onclick="App.Knowledge.saveTextbook()">保存</button></div>
    `);
  },
  saveTextbook(){
    const bank=App.DataStore.getKnowledgeBase();
    Object.keys(bank.subjects).forEach(k=>{
      const el=document.getElementById('tb-'+k);
      if(el)bank.subjects[k].textbook=el.value.trim();
    });
    App.DataStore.saveKnowledgeBase(bank);
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast('教材版本已更新','success');
  },
};

  review(mistakeId){

/* ===== 种植田模块 ===== */
App.Farm = {
  gameTimer:null,
  plantNames:{sunflower:'向日葵',rice:'水稻',potato:'土豆',pea:'豌豆',cotton:'棉花',money_tree:'发财树'},
  init(){
    this.gameTimer=setInterval(()=>this.tick(),5000);
    this.calculateOfflineProduction();
  },
  afterRender(){},
  tick(){
    const uid=App.DataStore.getCurrentUserId();
    const farm=App.DataStore.getFarmData(uid);
    const config=App.DataStore.getGameConfig().rules;
    let changed=false;
    const newPending=[];
    let sunlightWarn=false;
    Object.entries(farm.grid).forEach(([pid,plot])=>{
      if(!plot.plantType||plot.stage==='withered')return;
      /* 初始化health（所有植物统一） */
      if(plot.health===undefined)plot.health=100;
      /* 生命值衰减：未浇水或向日葵阳光不足时，按 healthDecayPerDay%/天 衰减 */
      const needDecay=plot.needWater||(plot.plantType==='sunflower'&&farm.resources.sunlight<=0);
      if(needDecay){
        plot.health-=config.healthDecayPerDay*(5/86400);
        if(plot.health<30)plot.needWater=true;
        if(plot.health<=0){plot.stage='withered';changed=true;}
        if(plot.plantType==='sunflower'&&farm.resources.sunlight<=0)sunlightWarn=true;
      }
      /* 虫害随机产生 */
      if(plot.bugLevel===undefined)plot.bugLevel=0;
      if(plot.bugLevel<3&&Math.random()<0.06){plot.bugLevel++;changed=true;}
      /* 杂草随机产生 */
      if(plot.weedLevel===undefined)plot.weedLevel=0;
      if(plot.weedLevel<3&&Math.random()<0.06){plot.weedLevel++;changed=true;}
      /* 虫害/杂草降低产出效率 */
      const efficiency=(1-plot.bugLevel*0.2-plot.weedLevel*0.15);
      if(plot.autoProduce&&plot.stage!=='withered'&&efficiency>0){
        const now=Date.now();
        const elapsed=(now-plot.autoProduce.lastProduceAt)/1000;
        if(elapsed>=plot.autoProduce.interval){
          const cycles=Math.min(Math.floor(elapsed/plot.autoProduce.interval),10);
          const amount=Math.round(plot.autoProduce.amount*cycles*efficiency);
          if(amount>0){
            newPending.push({plotId:pid,resource:plot.autoProduce.resource,amount,producedAt:now});
          }
          plot.autoProduce.lastProduceAt+=cycles*plot.autoProduce.interval*1000;
          if(plot.stage==='seed')plot.stage='sprout';
          else if(plot.stage==='sprout')plot.stage='growing';
          else if(plot.stage==='growing')plot.stage='mature';
          changed=true;
        }
      }
    });
    /* 每日浇水检查：当天未浇水则标记needWater */
    const today=App.Utils.todayStr();
    if(farm.lastWaterDate!==today){
      Object.entries(farm.grid).forEach(([pid,plot])=>{
        if(plot.plantType&&plot.stage!=='withered'){
          plot.needWater=true;
        }
      });
      changed=true;
    }
    if(newPending.length>0){farm.pendingCollect=farm.pendingCollect.concat(newPending);changed=true;}
    if(sunlightWarn&&App.Router.currentRoute==='farm'){
      App.Utils.toast('⚠️ 阳光不足！向日葵正在枯萎，快收集阳光','error');
    }
    if(changed){
      App.DataStore.saveFarmData(uid,farm);
      if(App.Router.currentRoute==='farm')App.Router.handleRoute();
    }
  },
  calculateOfflineProduction(){
    const users=App.DataStore.getUsers().users;
    users.forEach(u=>{
      const farm=App.DataStore.getFarmData(u.id);
      const config=App.DataStore.getGameConfig().rules;
      let changed=false;
      Object.entries(farm.grid).forEach(([pid,plot])=>{
        if(!plot.autoProduce||plot.stage==='withered')return;
        const now=Date.now();
        const elapsed=(now-plot.autoProduce.lastProduceAt)/1000;
        if(elapsed>=plot.autoProduce.interval){
          const maxOffline=24;
          const cycles=Math.min(Math.floor(elapsed/plot.autoProduce.interval),maxOffline);
          if(cycles>0){
            farm.pendingCollect.push({plotId:pid,resource:plot.autoProduce.resource,amount:plot.autoProduce.amount*cycles,producedAt:now});
            plot.autoProduce.lastProduceAt+=cycles*plot.autoProduce.interval*1000;
            changed=true;
          }
        }
        if(plot.plantType&&plot.stage!=='withered'){
          if(plot.health===undefined)plot.health=100;
          /* 离线期间若未浇水则按 healthDecayPerDay 衰减 */
          if(plot.needWater||(plot.plantType==='sunflower'&&farm.resources.sunlight<=0)){
            const hoursPassed=(now-(plot.plantedAt||now))/3600000;
            const daysPassed=hoursPassed/24;
            plot.health=Math.max(0,plot.health-config.healthDecayPerDay*daysPassed);
            if(plot.health<=0)plot.stage='withered';
            changed=true;
          }
        }
      });
      if(changed)App.DataStore.saveFarmData(u.id,farm);
    });
  },
  handlePlotClick(uid,pid){
    const farm=App.DataStore.getFarmData(uid);
    const plot=farm.grid[pid];
    const pending=farm.pendingCollect.filter(p=>p.plotId===pid);
    if(!plot.plantType){
      App.Utils.toast('请从下方选择要种植的作物~');
      return;
    }
    if(pending.length>0){
      pending.forEach(item=>{farm.resources[item.resource]=(farm.resources[item.resource]||0)+item.amount;});
      farm.pendingCollect=farm.pendingCollect.filter(p=>p.plotId!==pid);
      if(plot.plantType==='sunflower'&&plot.health!==undefined){
        plot.health=Math.min(100,plot.health+20);
      }
      App.DataStore.saveFarmData(uid,farm);
      App.Router.handleRoute();
      App.Utils.toast('收集成功！','success');
      return;
    }
    if(plot.stage==='withered'){
      if(confirm('这株植物枯萎了，清除吗？')){
        farm.grid[pid]={plantType:null,stage:'empty'};
        App.DataStore.saveFarmData(uid,farm);
        App.Router.handleRoute();
      }
      return;
    }
    /* 有植物时显示操作菜单 */
    this.showPlotActions(uid,pid,plot);
  },
  showPlotActions(uid,pid,plot){
    const inventory=App.DataStore.getInventory(uid);
    const hasShovel=Object.values(inventory.items).find(i=>i.category==='tool'&&i.name.includes('铲子')&&i.quantity>0);
    const hasBugSpray=Object.values(inventory.items).find(i=>i.category==='tool'&&i.name.includes('除虫')&&i.quantity>0);
    const hasWeedClipper=Object.values(inventory.items).find(i=>i.category==='tool'&&i.name.includes('除草')&&i.quantity>0);
    const hasWaterCan=Object.values(inventory.items).find(i=>i.category==='tool'&&i.name.includes('浇水')&&i.quantity>0);
    const bugLvl=plot.bugLevel||0;
    const weedLvl=plot.weedLevel||0;
    const needWater=plot.needWater||(plot.health!==undefined&&plot.health<50);
    App.Renderer.openModal(`
      <h3>${this.plantNames[plot.plantType]} · ${this.stageName(plot.stage)}</h3>
      ${plot.health!==undefined?`<div style="font-size:13px;margin-bottom:8px">生命值: ${Math.round(plot.health)}%</div>`:''}
      ${bugLvl>0?`<div style="font-size:13px;color:#C62828;margin-bottom:4px">🐛 虫害 ${bugLvl}级 - 降低产出 ${bugLvl*20}%</div>`:''}
      ${weedLvl>0?`<div style="font-size:13px;color:#E65100;margin-bottom:4px">🌿 杂草 ${weedLvl}级 - 降低产出 ${weedLvl*15}%</div>`:''}
      ${needWater?`<div style="font-size:13px;color:#1565C0;margin-bottom:4px">💧 需要浇水</div>`:''}
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:12px">
        ${needWater?`<button class="btn ${hasWaterCan?'btn-primary':'btn-secondary'}" ${hasWaterCan?'':'disabled'} onclick="App.Farm.waterPlant('${uid}','${pid}')">💧 浇水 ${hasWaterCan?'(消耗洒水壶)':'(需购买洒水壶)'}</button>`:''}
        ${bugLvl>0?`<button class="btn ${hasBugSpray?'btn-primary':'btn-secondary'}" ${hasBugSpray?'':'disabled'} onclick="App.Farm.removeBug('${uid}','${pid}')">🧴 除虫 ${hasBugSpray?'(消耗除虫剂)':'(需购买除虫剂)'}</button>`:''}
        ${weedLvl>0?`<button class="btn ${hasWeedClipper?'btn-primary':'btn-secondary'}" ${hasWeedClipper?'':'disabled'} onclick="App.Farm.removeWeed('${uid}','${pid}')">✂️ 除草 ${hasWeedClipper?'(消耗除草剪)':'(需购买除草剪)'}</button>`:''}
        <button class="btn ${hasShovel?'btn-danger':'btn-secondary'}" ${hasShovel?'':'disabled'} onclick="App.Farm.digUp('${uid}','${pid}')">⛏️ 铲除 ${hasShovel?'(消耗铲子)':'(需购买铲子)'}</button>
      </div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="App.Renderer.closeModal()">关闭</button></div>
    `);
  },
  waterPlant(uid,pid){
    this.useTool(uid,'浇水',pid,(plot)=>{
      plot.health=Math.min(100,plot.health+40);
      plot.needWater=false;
      const farm=App.DataStore.getFarmData(uid);
      farm.lastWaterDate=App.Utils.todayStr();
      App.DataStore.saveFarmData(uid,farm);
    });
  },
  removeBug(uid,pid){
    this.useTool(uid,'除虫',pid,(plot)=>{plot.bugLevel=0;});
  },
  removeWeed(uid,pid){
    this.useTool(uid,'除草',pid,(plot)=>{plot.weedLevel=0;});
  },
  digUp(uid,pid){
    this.useTool(uid,'铲子',pid,(plot)=>{return true;});
  },
  /* ---------- 一键工具（作用于全部种植田） ---------- */
  collectAll(uid){
    const inventory=App.DataStore.getInventory(uid);
    const itemEntry=Object.entries(inventory.items).find(([id,it])=>it.category==='tool'&&it.name.includes('一键收集')&&it.quantity>0);
    if(!itemEntry){App.Utils.toast('没有一键收集器！去商城购买','error');return;}
    const farm=App.DataStore.getFarmData(uid);
    if(farm.pendingCollect.length===0){App.Utils.toast('暂无可收集的产出','error');return;}
    let totalCollected={};
    farm.pendingCollect.forEach(item=>{
      farm.resources[item.resource]=(farm.resources[item.resource]||0)+item.amount;
      totalCollected[item.resource]=(totalCollected[item.resource]||0)+item.amount;
      /* 收集时恢复生命值 */
      const plot=farm.grid[item.plotId];
      if(plot&&plot.health!==undefined)plot.health=Math.min(100,plot.health+5);
    });
    farm.pendingCollect=[];
    itemEntry[1].quantity--;
    if(itemEntry[1].quantity<=0)delete inventory.items[itemEntry[0]];
    App.DataStore.saveInventory(uid,inventory);
    App.DataStore.saveFarmData(uid,farm);
    App.Router.handleRoute();
    const summary=Object.entries(totalCollected).map(([k,v])=>`${k}+${v}`).join(' ');
    App.Utils.toast('📦 一键收集成功！'+summary,'success');
  },
  weedAll(uid){
    const inventory=App.DataStore.getInventory(uid);
    const itemEntry=Object.entries(inventory.items).find(([id,it])=>it.category==='tool'&&it.name.includes('一键除草')&&it.quantity>0);

    App.DataStore.saveFarmData(uid,farm);
    App.Router.handleRoute();
    App.Utils.toast('🌿 一键除草成功！清除'+cleared+'块田','success');
  },

  },
  useTool(uid,toolName,pid,action){
    const inventory=App.DataStore.getInventory(uid);
    const itemEntry=Object.entries(inventory.items).find(([id,it])=>it.category==='tool'&&it.name.includes(toolName)&&it.quantity>0);
    if(!itemEntry){App.Utils.toast('没有'+toolName+'！去商城购买','error');return;}
    const farm=App.DataStore.getFarmData(uid);
    const plot=farm.grid[pid];

    if(result===true){farm.grid[pid]={plantType:null,stage:'empty'};}
    itemEntry[1].quantity--;
    if(itemEntry[1].quantity<=0)delete inventory.items[itemEntry[0]];
    App.DataStore.saveInventory(uid,inventory);
    App.DataStore.saveFarmData(uid,farm);
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast(toolName+'使用成功！','success');
  },
  stageName(s){return{seed:'种子',sprout:'发芽',growing:'生长中',mature:'成熟',withered:'枯萎'}[s]||s;},
  quickPlant(uid,plantType){
    const farm=App.DataStore.getFarmData(uid);
    const config=App.DataStore.getGameConfig().rules;
    const costs={sunflower:config.sunflowerCost,rice:config.riceCost,potato:config.potatoCost,pea:config.peaCost,cotton:config.cottonCost};
    const cost=costs[plantType];
    if(farm.seedlings<cost){App.Utils.toast(`小苗不足！需要${cost}颗`,'error');return;}
    const emptyPlot=Object.entries(farm.grid).find(([id,p])=>!p.plantType);
    if(!emptyPlot){App.Utils.toast('种植田已满！','error');return;}
    const produceConfig={
      sunflower:{resource:'sunlight',interval:config.sunflowerProduceInterval,amount:config.sunflowerProduceAmount},
      rice:{resource:'rice',interval:config.cropProduceInterval,amount:config.cropProduceAmount},
      potato:{resource:'potato',interval:config.cropProduceInterval,amount:config.cropProduceAmount},
      pea:{resource:'pea',interval:config.cropProduceInterval,amount:config.cropProduceAmount},
      cotton:{resource:'cotton',interval:config.cropProduceInterval,amount:config.cropProduceAmount},
    };
    farm.seedlings-=cost;
    farm.grid[emptyPlot[0]]={plantType,stage:'seed',plantedAt:Date.now(),lastHarvestAt:null,health:100,bugLevel:0,weedLevel:0,needWater:false,autoProduce:produceConfig[plantType]?{...produceConfig[plantType],lastProduceAt:Date.now()}:null};
    App.DataStore.saveFarmData(uid,farm);
    App.Router.handleRoute();
    App.Utils.toast(`种下了一株${this.plantNames[plantType]}！`,'success');
    /* 消消乐：种满5颗向日葵提示换取发财树 */
    if(plantType==='sunflower'){this.checkSunflowerMerge(uid);}
  },
  checkSunflowerMerge(uid){
    const farm=App.DataStore.getFarmData(uid);
    const sunflowers=Object.entries(farm.grid).filter(([id,p])=>p.plantType==='sunflower'&&p.stage!=='withered');
    if(sunflowers.length>=5){
      const config=App.DataStore.getGameConfig().rules;
      setTimeout(()=>{
        App.Renderer.openModal(`
          <h3>🌳 消消乐 — 发财树兑换！</h3>
          <div style="text-align:center;font-size:60px;margin:10px 0">🌻×5 → 🌳</div>
          <div style="font-size:14px;color:var(--text-secondary);text-align:center;margin-bottom:12px">
            你已种植 ${sunflowers.length} 颗向日葵！<br>是否消除 5 颗向日葵，换取 1 棵发财树？<br><br>
            <span style="color:var(--mc-gold)">发财树每 ${config.moneyTreeProduceInterval}秒 产出 ${config.moneyTreeProduceAmount} 金币🪙</span>
          </div>
          <div class="modal-actions">
            <button class="btn btn-secondary" onclick="App.Renderer.closeModal()">再等等</button>
            <button class="btn btn-primary" onclick="App.Farm.doMergeSunflowers('${uid}')">🌳 立即兑换</button>
          </div>
        `);
      },500);
    }
  },
  doMergeSunflowers(uid){
    const farm=App.DataStore.getFarmData(uid);
    const config=App.DataStore.getGameConfig().rules;
    const sunflowers=Object.entries(farm.grid).filter(([id,p])=>p.plantType==='sunflower'&&p.stage!=='withered').slice(0,5);
    if(sunflowers.length<5){App.Utils.toast('向日葵不足5颗','error');App.Renderer.closeModal();return;}
    sunflowers.forEach(([id,p])=>{farm.grid[id]={plantType:null,stage:'empty'};});
    const emptyPlot=Object.entries(farm.grid).find(([id,p])=>!p.plantType);
    if(emptyPlot){
      farm.grid[emptyPlot[0]]={plantType:'money_tree',stage:'mature',plantedAt:Date.now(),health:100,bugLevel:0,weedLevel:0,needWater:false,autoProduce:{resource:'coins',interval:config.moneyTreeProduceInterval,amount:config.moneyTreeProduceAmount,lastProduceAt:Date.now()}};
    }
    App.DataStore.saveFarmData(uid,farm);
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast('🎉 恭喜！获得发财树一棵！','success');
  },
  exchangeCotton(uid){
    const farm=App.DataStore.getFarmData(uid);
    const config=App.DataStore.getGameConfig().rules;
    if(farm.resources.cotton<config.cottonToClothRatio){App.Utils.toast(`棉花不足！需要${config.cottonToClothRatio}个`,'error');return;}
    farm.resources.cotton-=config.cottonToClothRatio;
    farm.resources.cloth=(farm.resources.cloth||0)+1;
    App.DataStore.saveFarmData(uid,farm);
    App.Router.handleRoute();
    App.Utils.toast('兑换了1块布料！','success');
  },
  exchangeSunlight(uid){
    const farm=App.DataStore.getFarmData(uid);
    const config=App.DataStore.getGameConfig().rules;
    const ratio=config.sunlightToSeedlingRatio||10;
    if(farm.resources.sunlight<ratio){App.Utils.toast(`阳光不足！需要${ratio}☀️换1🌱`,'error');return;}
    const count=Math.floor(farm.resources.sunlight/ratio);
    App.Renderer.openModal(`
      <h3>☀️ 阳光换小苗</h3>
      <div style="font-size:14px;color:var(--text-secondary);margin-bottom:8px">当前阳光：${farm.resources.sunlight}☀️<br>兑换比例：${ratio}☀️ = 1🌱<br>可兑换：<b style="color:var(--theme-color);font-size:18px">${count}</b> 颗小苗</div>
      <div class="form-group"><label>兑换数量</label><input type="number" id="exchange-amount" value="${count}" min="1" max="${count}"></div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="App.Renderer.closeModal()">取消</button><button class="btn btn-primary" onclick="App.Farm.doExchangeSunlight('${uid}',${ratio})">兑换</button></div>
    `);
  },
  doExchangeSunlight(uid,ratio){
    const amount=parseInt(document.getElementById('exchange-amount').value)||0;
    if(amount<=0){App.Utils.toast('请输入有效数量','error');return;}
    const farm=App.DataStore.getFarmData(uid);
    const cost=amount*ratio;
    if(farm.resources.sunlight<cost){App.Utils.toast('阳光不足','error');return;}
    farm.resources.sunlight-=cost;
    farm.seedlings+=amount;
    if(amount>0)farm.totalSeedlingsEarned+=amount;
    App.DataStore.saveFarmData(uid,farm);
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast(`用${cost}☀️兑换了${amount}🌱小苗！`,'success');
  },
  removeDecoration(uid,decId){
    if(!confirm('移除此装饰？'))return;
    const farm=App.DataStore.getFarmData(uid);
    if(farm.decorations){
      farm.decorations=farm.decorations.filter(d=>d.decId!==decId);
      App.DataStore.saveFarmData(uid,farm);
      App.Router.handleRoute();
      App.Utils.toast('装饰已移除');
    }
  },
  sellCrops(uid){
    const farm=App.DataStore.getFarmData(uid);
    const config=App.DataStore.getGameConfig().rules;
    const crops=[
      {key:'rice',emoji:'🌾',name:'水稻',price:config.riceSellPrice},
      {key:'potato',emoji:'🥔',name:'土豆',price:config.potatoSellPrice},
      {key:'pea',emoji:'🫛',name:'豌豆',price:config.peaSellPrice},
      {key:'cotton',emoji:'☁️',name:'棉花',price:config.cottonSellPrice},
      {key:'cloth',emoji:'🧵',name:'布料',price:config.clothSellPrice},
    ];
    const hasAny=crops.some(c=>(farm.resources[c.key]||0)>0);
    if(!hasAny){App.Utils.toast('没有可卖的农作物！','error');return;}
    App.Renderer.openModal(`
      <h3>💰 卖农作物换现金</h3>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">选择要卖出的农作物，获得💰现金纸币</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${crops.map(c=>`
          <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg-card-2);border-radius:8px">
            <span style="font-size:20px">${c.emoji}</span>
            <span style="flex:1;font-size:13px">${c.name}</span>
            <span style="font-size:12px;color:var(--text-secondary)">库存${farm.resources[c.key]||0}</span>
            <span style="font-size:12px;color:#2E7D32">单价${c.price}💰</span>
            <input type="number" id="sell-${c.key}" value="0" min="0" max="${farm.resources[c.key]||0}" style="width:50px;text-align:center" onchange="document.getElementById('sell-${c.key}-total').textContent=this.value*${c.price}">
            <span style="font-size:12px;width:40px;text-align:right" id="sell-${c.key}-total">0</span>
          </div>
        `).join('')}
      </div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="App.Renderer.closeModal()">取消</button><button class="btn btn-primary" style="background:#66BB6A" onclick="App.Farm.doSellCrops('${uid}')">卖出</button></div>
    `);
  },
  doSellCrops(uid){
    const farm=App.DataStore.getFarmData(uid);
    const config=App.DataStore.getGameConfig().rules;
    const crops=[
      {key:'rice',price:config.riceSellPrice},
      {key:'potato',price:config.potatoSellPrice},
      {key:'pea',price:config.peaSellPrice},
      {key:'cotton',price:config.cottonSellPrice},
      {key:'cloth',price:config.clothSellPrice},
    ];
    let totalCash=0;
    let soldAny=false;
    crops.forEach(c=>{
      const val=parseInt(document.getElementById('sell-'+c.key)?.value)||0;
      if(val>0){
        const stock=farm.resources[c.key]||0;
        const actual=Math.min(val,stock);
        if(actual>0){
          farm.resources[c.key]-=actual;
          totalCash+=actual*c.price;
          soldAny=true;
        }
      }
    });
    if(!soldAny){App.Utils.toast('请输入要卖出的数量','error');return;}
    farm.resources.cash=(farm.resources.cash||0)+totalCash;
    App.DataStore.saveFarmData(uid,farm);
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast(`卖了农作物，获得 ${totalCash}💰现金！`,'success');
  },
  checkStreak(uid,date){
    const streak=App.DataStore.getStreakData(uid);
    const yesterday=App.Utils.dateOffset(date,-1);
    if(streak.lastCheckinDate===yesterday){streak.currentStreak++;}
    else if(streak.lastCheckinDate!==date){streak.currentStreak=1;}
    streak.lastCheckinDate=date;
    streak.streakHistory[date]=true;
    streak.maxStreak=Math.max(streak.maxStreak,streak.currentStreak);
    const config=App.DataStore.getGameConfig().rules;
    /* 连续打卡奖励改为小苗（发财树改由消消乐获得） */
    if(streak.currentStreak>0&&streak.currentStreak%config.streakDaysForMoneyTree===0){
      App.DataStore.addSeedling(uid,10);
      App.Utils.toast('🎉 连续打卡'+config.streakDaysForMoneyTree+'天！奖励 🌱小苗 +10','success');
    }
    App.DataStore.saveStreakData(uid,streak);
  },
};

  // 抚摸：+开心度，不限次数但有冷却（每次+3，上限100）
  pet(uid,petId){
    const petData=App.DataStore.getPetData(uid);
    const pet=petData.pets.find(p=>p.petId===petId);
    if(!pet)return;
    const now=Date.now();
    const lastPet=pet.lastPetAt||0;
    const cooldown=30000; // 30秒冷却
    if(now-lastPet<cooldown){
      const remain=Math.ceil((cooldown-(now-lastPet))/1000);
      App.Utils.toast(pet.name+' 还在享受刚才的抚摸...('+remain+'s)','' );
      return;
    }
    pet.happiness=Math.min(100,pet.happiness+3);
    pet.lastPetAt=now;
    App.DataStore.savePetData(uid,petData);
    App.Router.handleRoute();
    const mood=pet.happiness>70?'happy':pet.happiness>40?'normal':'sad';
    App.Utils.toast(this.randomPhrase(this.petPhrases[mood]),'success');
  },
  // 玩耍：+开心度更多(+8)，但消耗饱食度(-5)
  play(uid,petId){
    const petData=App.DataStore.getPetData(uid);
    const pet=petData.pets.find(p=>p.petId===petId);
    if(!pet)return;
    if(pet.hunger<20){
      App.Utils.toast(this.randomPhrase(this.petPhrases.hungry_play),'error');
      return;
    }
    pet.happiness=Math.min(100,pet.happiness+8);
    pet.hunger=Math.max(0,pet.hunger-5);
    pet.lastPlayAt=Date.now();
    App.DataStore.savePetData(uid,petData);
    App.Router.handleRoute();
    App.Utils.toast(this.randomPhrase(this.petPhrases.play),'success');
  },
  feed(uid,petId){
    const petData=App.DataStore.getPetData(uid);
    const farm=App.DataStore.getFarmData(uid);
    const pet=petData.pets.find(p=>p.petId===petId);
    if(!pet)return;
    if(farm.resources.rice>0){
      farm.resources.rice--;
      pet.hunger=Math.min(100,pet.hunger+30);
      pet.happiness=Math.min(100,pet.happiness+5);
      pet.lastFedAt=Date.now();
      App.DataStore.saveFarmData(uid,farm);
      App.DataStore.savePetData(uid,petData);
      App.Router.handleRoute();
      App.Utils.toast(pet.name+' 吃饱了！😋','success');
    }else{
      const inventory=App.DataStore.getInventory(uid);
      const foodItem=Object.values(inventory.items).find(i=>i.category==='food'&&i.quantity>0);
      if(foodItem){
        const shopItem=App.DataStore.getShopItem(foodItem.itemId);
        foodItem.quantity--;
        pet.hunger=Math.min(100,pet.hunger+(shopItem?.effect?.hunger||20));
        pet.happiness=Math.min(100,pet.happiness+(shopItem?.effect?.happiness||5));
        pet.lastFedAt=Date.now();
        App.DataStore.saveInventory(uid,inventory);
        App.DataStore.savePetData(uid,petData);
        App.Router.handleRoute();
        App.Utils.toast(pet.name+' 吃了'+foodItem.name+'！😋','success');
      }else{
        App.Utils.toast('没有食物了！种🌾水稻或去商城购买','error');
      }
    }
  },
  openWardrobe(uid,petId){
    const inventory=App.DataStore.getInventory(uid);
    const clothingItems=Object.values(inventory.items).filter(i=>i.category==='clothing'&&i.quantity>0);
    const petData=App.DataStore.getPetData(uid);
    const pet=petData.pets.find(p=>p.petId===petId);
    App.Renderer.openModal(`
      <h3>👗 ${pet.name}的衣柜</h3>
      ${clothingItems.length===0?'<div class="empty-state">暂无服装，去商城购买或用棉花换布料</div>':
        clothingItems.map(i=>{
          const shopItem=App.DataStore.getShopItem(i.itemId);
          const slot=shopItem?.effect?.slot||'accessory';
          return`<div class="manage-row"><span style="font-size:20px">${shopItem?.icon||'👕'}</span><span class="item-name">${i.name}</span><button class="btn btn-primary" onclick="App.Pet.equipClothing('${uid}','${petId}','${i.itemId}','${slot}')">穿戴</button></div>`;
        }).join('')}
      <div class="modal-actions"><button class="btn btn-secondary" onclick="App.Renderer.closeModal()">关闭</button></div>
    `);
  },
  equipClothing(uid,petId,itemId,slot){
    const petData=App.DataStore.getPetData(uid);
    const pet=petData.pets.find(p=>p.petId===petId);
    const inventory=App.DataStore.getInventory(uid);
    const item=inventory.items[itemId];
    if(!item||item.quantity<=0)return;
    if(pet.clothing[slot]){
      const oldItem=pet.clothing[slot];
      if(inventory.items[oldItem])inventory.items[oldItem].quantity++;
    }
    pet.clothing[slot]=itemId;
    item.quantity--;
    if(item.quantity<=0)delete inventory.items[itemId];
    App.DataStore.savePetData(uid,petData);
    App.DataStore.saveInventory(uid,inventory);
    App.Renderer.closeModal();
    App.Router.handleRoute();

  changeIcon(uid,petId){

    if(!pet)return;

      <h3>🎨 更换 ${pet.name} 的图标</h3>
      <div class="form-group">
        <label>当前图标</label>

      </div>

      </div>
      <div class="form-group">
        <label>表情风格（内置emoji）</label>
        <div class="svg-icon-picker">${petEmojis.map(e=>`<div class="svg-icon-option ${currentIcon===e?'selected':''}" onclick="App.Pet.selectPetIconStyle('${e}')" data-key="${e}">${App.Utils.renderIcon(e,28)}</div>`).join('')}</div>
      </div>

        <label>自定义图片</label>
        <label class="upload-btn">📷 上传图片<input type="file" accept="image/*" style="display:none" onchange="App.Pet.handlePetIconUpload(event,'${uid}','${petId}')"></label>
        <button class="btn btn-secondary" style="font-size:12px;margin-top:6px" onclick="App.Pet.resetPetIconStyle('${uid}','${petId}')">↩️ 恢复默认(${(App.Utils.petTypes.find(t=>t.type===pet.type)||{}).name||'默认'})</button>
      </div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="App.Renderer.closeModal()">取消</button><button class="btn btn-primary" onclick="App.Pet.savePetIcon('${uid}','${petId}')">保存</button></div>
    `);
    App.Pet._pendingPetIcon=null;
  },
  selectPetIconStyle(icon){
    document.querySelectorAll('.svg-icon-option').forEach(o=>o.classList.remove('selected'));
    document.querySelector(`.svg-icon-option[data-key="${icon}"]`).classList.add('selected');
    App.Pet._pendingPetIcon=icon;
    document.getElementById('pi-icon-preview').innerHTML=App.Utils.renderIcon(icon,48);
  },
  resetPetIconStyle(uid,petId){
    const petData=App.DataStore.getPetData(uid);
    const pet=petData.pets.find(p=>p.petId===petId);
    if(!pet)return;
    pet.icon=undefined;
    App.DataStore.savePetData(uid,petData);
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast('已恢复默认图标','success');
  },
  handlePetIconUpload(event,uid,petId){
    const file=event.target.files[0];
    if(!file)return;
    if(file.size>512*1024){App.Utils.toast('图片不能超过512KB','error');return;}
    const reader=new FileReader();
    reader.onload=(e)=>{
      const dataUrl=e.target.result;
      App.Pet._pendingPetIcon=dataUrl;
      document.querySelectorAll('.svg-icon-option').forEach(o=>o.classList.remove('selected'));
      document.getElementById('pi-icon-preview').innerHTML=App.Utils.renderIcon(dataUrl,48);
      App.Utils.toast('图片已加载，点击保存生效','success');
    };
    reader.readAsDataURL(file);
  },
  savePetIcon(uid,petId){
    const petData=App.DataStore.getPetData(uid);
    const pet=petData.pets.find(p=>p.petId===petId);
    if(!pet)return;
    if(App.Pet._pendingPetIcon!==undefined&&App.Pet._pendingPetIcon!==null){
      pet.icon=App.Pet._pendingPetIcon;
    }
    App.Pet._pendingPetIcon=null;
    App.DataStore.savePetData(uid,petData);
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast('图标已更新！','success');
  },
  decayTick(){
    const uid=App.DataStore.getCurrentUserId();
    const petData=App.DataStore.getPetData(uid);
    const config=App.DataStore.getGameConfig().rules;
    let changed=false;
    petData.pets.forEach(pet=>{
      const before=pet.hunger;
      pet.hunger=Math.max(0,pet.hunger-config.petHungerDecayPerHour*(5/3600));
      if(pet.hunger<30)pet.happiness=Math.max(0,pet.happiness-0.5);
      if(Math.abs(before-pet.hunger)>0.01)changed=true;
    });
    if(changed)App.DataStore.savePetData(uid,petData);
  },
};

/* ===== 游戏模块（翻牌记忆） ===== */
App.Game = {
  _state:null,
  exchangeGame(uid){
    const farm=App.DataStore.getFarmData(uid);
    const config=App.DataStore.getGameConfig().rules;
    const today=App.Utils.todayStr();
    let gl=farm.gamePlayLog||{date:'',count:0};
    if(gl.date!==today){gl={date:today,count:0};}
    const remaining=config.gamePlayDailyLimit-gl.count;
    if(remaining<=0){App.Utils.toast('今日游戏次数已用完！','error');return;}
    if((farm.resources.cash||0)<config.gamePlayCost){App.Utils.toast(`现金不足！需要${config.gamePlayCost}💰`,'error');return;}
    // 扣费+记录次数
    farm.resources.cash=(farm.resources.cash||0)-config.gamePlayCost;
    gl.count++;
    farm.gamePlayLog=gl;
    App.DataStore.saveFarmData(uid,farm);
    this.initMemoryGame(uid);
  },
  initMemoryGame(uid){
    const config=App.DataStore.getGameConfig().rules;
    const emojis=['🍎','🍌','🍇','🍓','🍊','🍉'];
    const cards=[...emojis,...emojis];
    // 洗牌
    for(let i=cards.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [cards[i],cards[j]]=[cards[j],cards[i]];
    }
    this._state={
      uid:uid,
      cards:cards,
      flipped:[],
      matched:[],
      moves:0,
      startTime:Date.now(),
      reward:config.gameWinReward
    };
    App.Renderer.openModal(`
      <h3>🎮 翻牌记忆游戏</h3>
      <div class="mem-game-info">
        <span>步数: <span id="mem-moves">0</span></span>
        <span>配对: <span id="mem-matched">0</span>/6</span>
        <span>奖励: 🌱+${config.gameWinReward}</span>
      </div>
      <div class="mem-game-grid" id="mem-grid">
        ${cards.map((_,i)=>`<div class="mem-card back" id="mem-card-${i}" onclick="App.Game.flipCard(${i})"></div>`).join('')}
      </div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="App.Renderer.closeModal()">放弃</button></div>
    `);
  },
  flipCard(index){
    const s=this._state;
    if(!s)return;
    if(s.matched.includes(index)||s.flipped.includes(index))return;
    if(s.flipped.length>=2)return;
    const cardEl=document.getElementById('mem-card-'+index);
    if(!cardEl)return;
    cardEl.classList.remove('back');
    cardEl.classList.add('flipped');
    cardEl.textContent=s.cards[index];
    s.flipped.push(index);
    if(s.flipped.length===2){
      s.moves++;
      document.getElementById('mem-moves').textContent=s.moves;
      const [a,b]=s.flipped;
      if(s.cards[a]===s.cards[b]){
        // 配对成功
        setTimeout(()=>{
          document.getElementById('mem-card-'+a).classList.add('matched');
          document.getElementById('mem-card-'+b).classList.add('matched');
          s.matched.push(a,b);
          s.flipped=[];
          document.getElementById('mem-matched').textContent=s.matched.length/2;
          if(s.matched.length===s.cards.length){
            this.onGameWin(s.uid);
          }
        },500);
      }else{
        // 配对失败
        setTimeout(()=>{
          document.getElementById('mem-card-'+a).classList.remove('flipped');
          document.getElementById('mem-card-'+a).classList.add('back');
          document.getElementById('mem-card-'+a).textContent='';
          document.getElementById('mem-card-'+b).classList.remove('flipped');
          document.getElementById('mem-card-'+b).classList.add('back');
          document.getElementById('mem-card-'+b).textContent='';
          s.flipped=[];
        },1000);
      }
    }
  },
  onGameWin(uid){
    const s=this._state;
    const config=App.DataStore.getGameConfig().rules;
    const reward=config.gameWinReward;
    const elapsed=Math.round((Date.now()-s.startTime)/1000);
    App.DataStore.addSeedling(uid,reward);
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast(`🎉 恭喜通关！${s.moves}步 / ${elapsed}秒 → 🌱小苗+${reward}`,'success');
    this._state=null;
  },
};

/* ===== 商城模块 ===== */
App.Shop = {
  currentCategory:'tool',
  selectCategory(cat){this.currentCategory=cat;App.Router.handleRoute();},
  buy(uid,itemId){
    const shop=App.DataStore.getShopData();
    const item=shop.items.find(i=>i.itemId===itemId);
    const farm=App.DataStore.getFarmData(uid);
    if(farm.resources.coins<item.price.amount){App.Utils.toast('金币不足！','error');return;}
    if(item.effect?.type==='new_pet'){
      const petData=App.DataStore.getPetData(uid);
      const ptDef=App.Utils.petTypes.find(t=>t.type===item.effect.petType)||{type:item.effect.petType,name:'新宠',icon:item.effect.petType};
      const petName=ptDef.name||'新宠';
      petData.pets.push({petId:App.Utils.genId('pet'),type:item.effect.petType,name:petName,icon:item.icon||ptDef.icon||item.effect.petType,hunger:60,happiness:70,clothing:{hat:null,shirt:null,accessory:null},adoptedAt:Date.now(),lastFedAt:Date.now()});
      App.DataStore.savePetData(uid,petData);
    }else if(item.effect?.type==='heal_plant'){
      const plots=Object.values(farm.grid).filter(p=>p.plantType&&p.health!==undefined&&p.stage!=='withered');
      if(plots.length===0){App.Utils.toast('没有需要浇水的植物','error');return;}
      plots.forEach(p=>p.health=100);
      App.DataStore.saveFarmData(uid,farm);
      App.Router.handleRoute();
      App.Utils.toast('所有植物已浇水恢复！','success');
      return;
    }else if(item.effect?.type==='decoration'){
      /* 装饰类道具直接添加到农田装饰栏 */
      if(!farm.decorations)farm.decorations=[];
      farm.decorations.push({decId:App.Utils.genId('dec'),itemId,itemName:item.name,icon:item.icon,category:item.category});
      App.DataStore.saveFarmData(uid,farm);
    }else{
      const inventory=App.DataStore.getInventory(uid);
      if(inventory.items[itemId])inventory.items[itemId].quantity++;
      else inventory.items[itemId]={itemId,name:item.name,quantity:1,category:item.category};
      App.DataStore.saveInventory(uid,inventory);
    }
    farm.resources.coins-=item.price.amount;
    App.DataStore.saveFarmData(uid,farm);
    App.Router.handleRoute();
    App.Utils.toast('购买了'+item.name+'！','success');

      item.effect={type:'new_pet',petType:petTypeEl?petTypeEl.value:(item.effect?.petType||'dog')};
    }else if(cat==='food'){
      item.effect={type:'feed_pet',hunger:parseInt(document.getElementById('ei-hunger')?.value)||20,happiness:parseInt(document.getElementById('ei-happiness')?.value)||5};
    }else if(cat==='clothing'){
      const slotEl=document.getElementById('ei-cloth-slot');
      item.effect={type:'clothing',slot:slotEl?slotEl.value:(item.effect?.slot||'hat')};
    }else if(cat==='tool'){
      const toolEl=document.getElementById('ei-tool-effect');
      item.effect={type:toolEl?toolEl.value:(item.effect?.type||'tool')};
    }else{
      item.effect=item.effect||{type:'decoration'};
    }
    App.Shop._pendingItemIcon=null;
    App.Shop._selectedEmojiIcon=null;
    this._editItemEffect=null;
    App.DataStore.saveShopData(shop);
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast('已保存','success');
  },
  handleItemIconUpload(event){
    const file=event.target.files[0];
    if(!file)return;
    if(file.size>512*1024){App.Utils.toast('图片不能超过512KB','error');return;}
    const reader=new FileReader();
    reader.onload=(e)=>{
      App.Shop._pendingItemIcon=e.target.result;
      document.getElementById('ei-icon-preview').innerHTML=App.Utils.renderIcon(e.target.result,40);
      document.querySelectorAll('.svg-icon-option').forEach(o=>o.classList.remove('selected'));
      document.getElementById('ei-icon-emoji').value='';
      App.Utils.toast('图片已加载，点击保存生效','success');
    };
    reader.readAsDataURL(file);
  },
  selectSvgIcon(key){
    document.querySelectorAll('.svg-icon-option').forEach(o=>o.classList.remove('selected'));
    document.querySelector(`.svg-icon-option[data-key="${key}"]`).classList.add('selected');
    App.Shop._pendingItemIcon=null;
    App.Shop._selectedEmojiIcon=null;
    document.getElementById('ei-icon-preview').innerHTML=App.Utils.renderIcon(key,40);
    document.getElementById('ei-icon-emoji').value='';
  },
  selectEmojiIcon(emoji){
    document.querySelectorAll('.svg-icon-option').forEach(o=>o.classList.remove('selected'));
    document.querySelector(`.svg-icon-option[data-key="${emoji}"]`).classList.add('selected');
    App.Shop._pendingItemIcon=null;
    App.Shop._selectedEmojiIcon=emoji;
    document.getElementById('ei-icon-preview').innerHTML=App.Utils.renderIcon(emoji,40);
    document.getElementById('ei-icon-emoji').value='';
  },
  openAddItemDialog(){
    if(!App.ParentPanel.checkAuth()){App.ParentPanel.showLoginDialog();return;}
    const catNames={tool:'工具',food:'食物',clothing:'服装',building:'建筑',furniture:'家具',pet:'宠物'};
    const svgKeys=Object.keys(App.Utils.svgIcons);
    const petTypes=App.Utils.petTypes.map(t=>({k:t.type,n:t.name}));
    const clothSlots=[{k:'hat',n:'帽子'},{k:'shirt',n:'衣服'},{k:'accessory',n:'配饰'}];
    App.Renderer.openModal(`
      <h3>新增道具</h3>
      <div class="form-group"><label>名称</label><input type="text" id="ai-name"></div>
      <div class="form-group">
        <label>图标</label>
        <div class="icon-editor">
          <div class="icon-preview-box" id="ai-icon-preview"><span style="font-size:22px;color:var(--text-light)">🎁</span></div>
          <div class="icon-inputs">
            <input type="text" id="ai-icon-emoji" placeholder="emoji" style="width:80px;text-align:center;font-size:18px">
            <label class="upload-btn">📷 上传图片<input type="file" accept="image/*" style="display:none" onchange="App.Shop.handleAddItemIconUpload(event)"></label>
          </div>
        </div>
        <div class="svg-icon-picker">${svgKeys.map(k=>`<div class="svg-icon-option" onclick="App.Shop.selectAddSvgIcon('${k}')" data-key="${k}">${App.Utils.renderIcon(k,28)}</div>`).join('')}${App.Utils.emojiIcons.map(e=>`<div class="svg-icon-option" onclick="App.Shop.selectAddEmojiIcon('${e}')" data-key="${e}">${App.Utils.renderIcon(e,28)}</div>`).join('')}</div>
      </div>
      <div class="form-group"><label>描述</label><input type="text" id="ai-desc"></div>
      <div class="form-group"><label>分类</label><select id="ai-cat" onchange="App.Shop.updateAddEffectUI()">${Object.entries(catNames).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></div>
      <div class="form-group" id="ai-effect-group"></div>
      <div class="form-group"><label>价格(金币)</label><input type="number" id="ai-price" value="10"></div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="App.Renderer.closeModal()">取消</button><button class="btn btn-primary" onclick="App.Shop.saveNewItem()">保存</button></div>
    `);
    this.updateAddEffectUI();
  },
  updateAddEffectUI(){
    const cat=document.getElementById('ai-cat').value;
    const grp=document.getElementById('ai-effect-group');
    const petTypes=App.Utils.petTypes.map(t=>({k:t.type,n:t.name}));
    const clothSlots=[{k:'hat',n:'帽子'},{k:'shirt',n:'衣服'},{k:'accessory',n:'配饰'}];
    if(cat==='pet'){
      grp.innerHTML=`<label>宠物类型</label><select id="ai-pet-type">${petTypes.map(p=>`<option value="${p.k}">${p.n}</option>`).join('')}</select>`;
    }else if(cat==='food'){
      grp.innerHTML=`<label>喂食效果</label><div style="display:flex;gap:8px"><span>饱食+<input type="number" id="ai-hunger" value="20" style="width:60px"></span><span>开心+<input type="number" id="ai-happiness" value="5" style="width:60px"></span></div>`;
    }else if(cat==='clothing'){
      grp.innerHTML=`<label>装备槽位</label><select id="ai-cloth-slot">${clothSlots.map(s=>`<option value="${s.k}">${s.n}</option>`).join('')}</select>`;
    }else if(cat==='tool'){
      grp.innerHTML=`<label>道具效果</label><select id="ai-tool-effect"><option value="heal_plant">浇水恢复植物</option><option value="tool">通用工具</option></select>`;
    }else{
      grp.innerHTML='';
    }
  },
  handleAddItemIconUpload(event){
    const file=event.target.files[0];
    if(!file)return;
    if(file.size>512*1024){App.Utils.toast('图片不能超过512KB','error');return;}
    const reader=new FileReader();
    reader.onload=(e)=>{
      App.Shop._pendingAddItemIcon=e.target.result;
      document.getElementById('ai-icon-preview').innerHTML=App.Utils.renderIcon(e.target.result,40);
      document.querySelectorAll('.svg-icon-option').forEach(o=>o.classList.remove('selected'));
      document.getElementById('ai-icon-emoji').value='';
      App.Utils.toast('图片已加载','success');
    };
    reader.readAsDataURL(file);
  },
  selectAddSvgIcon(key){
    document.querySelectorAll('.svg-icon-option').forEach(o=>o.classList.remove('selected'));
    document.querySelector(`.svg-icon-option[data-key="${key}"]`).classList.add('selected');
    App.Shop._pendingAddItemIcon=null;
    App.Shop._selectedAddEmojiIcon=null;
    document.getElementById('ai-icon-preview').innerHTML=App.Utils.renderIcon(key,40);
    document.getElementById('ai-icon-emoji').value='';
  },
  selectAddEmojiIcon(emoji){
    document.querySelectorAll('.svg-icon-option').forEach(o=>o.classList.remove('selected'));
    document.querySelector(`.svg-icon-option[data-key="${emoji}"]`).classList.add('selected');
    App.Shop._pendingAddItemIcon=null;
    App.Shop._selectedAddEmojiIcon=emoji;
    document.getElementById('ai-icon-preview').innerHTML=App.Utils.renderIcon(emoji,40);
    document.getElementById('ai-icon-emoji').value='';
  },
  saveNewItem(){
    const name=document.getElementById('ai-name').value.trim();
    if(!name){App.Utils.toast('请输入名称','error');return;}
    // 图标优先级：上传图片 > SVG选择 > emoji输入
    let icon='🎁';
    if(App.Shop._pendingAddItemIcon){icon=App.Shop._pendingAddItemIcon;}
    else{
      const svgSel=document.querySelector('.svg-icon-option.selected');
      const emojiVal=document.getElementById('ai-icon-emoji').value.trim();
      if(svgSel)icon=svgSel.dataset.key;
      else if(emojiVal)icon=emojiVal;
    }
    const cat=document.getElementById('ai-cat').value;
    // 根据分类设置正确effect
    let effect={type:'decoration'};
    if(cat==='pet'){
      const petTypeEl=document.getElementById('ai-pet-type');
      effect={type:'new_pet',petType:petTypeEl?petTypeEl.value:'dog'};
    }else if(cat==='food'){
      effect={type:'feed_pet',hunger:parseInt(document.getElementById('ai-hunger')?.value)||20,happiness:parseInt(document.getElementById('ai-happiness')?.value)||5};
    }else if(cat==='clothing'){
      const slotEl=document.getElementById('ai-cloth-slot');
      effect={type:'clothing',slot:slotEl?slotEl.value:'hat'};
    }else if(cat==='tool'){
      const toolEl=document.getElementById('ai-tool-effect');
      effect={type:toolEl?toolEl.value:'tool'};
    }
    const shop=App.DataStore.getShopData();
    shop.items.push({
      itemId:App.Utils.genId('item'),name,icon,
      description:document.getElementById('ai-desc').value.trim(),category:cat,
      price:{currency:'coins',amount:parseInt(document.getElementById('ai-price').value)||0},
      effect:effect,available:true,stock:-1
    });
    App.DataStore.saveShopData(shop);
    App.Shop._pendingAddItemIcon=null;
    App.Shop._selectedAddEmojiIcon=null;
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast('道具已添加','success');
  },
};

/* ===== 家长后台模块 ===== */
App.ParentPanel = {
  authed:false,authExpiry:0,currentTab:'rules',
  checkAuth(){return this.authed&&Date.now()<this.authExpiry;},
  showLoginDialog(){
    App.Renderer.openModal(`
      <h3>🔐 家长验证</h3>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">请输入家长密码（默认：123456）</div>
      <div class="form-group"><input type="password" id="parent-password" placeholder="密码" onkeydown="if(event.key==='Enter')App.ParentPanel.doLogin()"></div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="App.Renderer.closeModal()">取消</button><button class="btn btn-primary" onclick="App.ParentPanel.doLogin()">确认</button></div>
    `);
    setTimeout(()=>document.getElementById('parent-password')?.focus(),100);
  },
  doLogin(){
    const pwd=document.getElementById('parent-password').value;
    const config=App.DataStore.getGameConfig();
    if(pwd===(config.parentPassword||'123456')){
      this.authed=true;this.authExpiry=Date.now()+30*60*1000;
      App.Renderer.closeModal();
      App.Router.navigate('parent');
      App.Utils.toast('验证成功','success');
    }else{App.Utils.toast('密码错误','error');}
  },
  tab(t){this.currentTab=t;App.Router.handleRoute();},
  updateRule(key,val){
    const config=App.DataStore.getGameConfig();
    config.rules[key]=parseFloat(val);
    App.DataStore.saveGameConfig(config);
    if(key==='gridRows'||key==='gridCols'){
      this.resizeFarmGrid();
    }
  },
  resizeFarmGrid(){
    const uid=App.DataStore.getCurrentUserId();
    const farm=App.DataStore.getFarmData(uid);
    const config=App.DataStore.getGameConfig().rules;
    const newSize=config.gridRows*config.gridCols;
    const oldGrid=farm.grid;
    const oldKeys=Object.keys(oldGrid);
    const newGrid={};
    for(let i=0;i<newSize;i++){
      const key='plot_'+i;
      if(oldKeys[i]){newGrid[key]=oldGrid[oldKeys[i]];}
      else{newGrid[key]={plantType:null,stage:'empty'};}
    }
    const lostCount=Math.max(0,oldKeys.length-newSize);
    farm.grid=newGrid;
    App.DataStore.saveFarmData(uid,farm);
    if(lostCount>0){
      App.Utils.toast('种植田已调整为 '+config.gridRows+'×'+config.gridCols+'，超出 '+lostCount+' 格被清空','error');
    }else{
      App.Utils.toast('种植田已调整为 '+config.gridRows+'×'+config.gridCols,'success');
    }
    if(App.Router.currentRoute==='farm')App.Router.handleRoute();
  },
  removeTaskType(uid,subject,typeId){
    if(!confirm('确定删除此任务？'))return;
    App.DataStore.removeTaskType(uid,subject,typeId);
    App.Router.handleRoute();
    App.Utils.toast('已删除');
  },
  openAddTaskType(uid,subject){
    App.Renderer.openModal(`
      <h3>添加任务</h3>
      <div class="form-group"><label>任务名称</label><input type="text" id="at-name"></div>
      <div class="form-group"><label>建议时长（分钟）</label><input type="number" id="at-duration" value="15"></div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="App.Renderer.closeModal()">取消</button><button class="btn btn-primary" onclick="App.ParentPanel.saveTaskType('${uid}','${subject}')">添加</button></div>
    `);
    setTimeout(()=>document.getElementById('at-name')?.focus(),100);
  },
  saveTaskType(uid,subject){
    const name=document.getElementById('at-name').value.trim();
    if(!name){App.Utils.toast('请输入名称','error');return;}
    const duration=parseInt(document.getElementById('at-duration').value)||15;
    App.DataStore.addCustomTaskType(uid,subject,name,duration);
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast('任务已添加','success');
  },
  exportData(){
    const allData={};
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(key.startsWith('dlp_')){try{allData[key]=JSON.parse(localStorage.getItem(key));}catch(e){}}
    }
    const cleaned=this._stripBlobs(allData);
    const blob=new Blob([JSON.stringify(cleaned,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='dlp_backup_'+App.Utils.todayStr()+'.json';a.click();
    URL.revokeObjectURL(url);
    App.Utils.toast('数据已导出（已自动精简头像等大文件，便于手机导入）','success');
  },
  // 递归剔除 base64 头像等大体积字段，避免备份文件过大导致手机端无法导入
  _stripBlobs(obj){
    if(typeof obj!=='object'||obj===null)return obj;
    if(Array.isArray(obj))return obj.map(it=>this._stripBlobs(it));
    const out={};
    for(const k in obj){
      if(k==='avatarImage'||k==='avatar')continue;
      out[k]=this._stripBlobs(obj[k]);
    }
    return out;
  },
  openImportData(){
    App.Renderer.openModal(`
      <h3>导入数据</h3>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">选择备份文件导入（将覆盖现有数据）</div>
      <input type="file" id="import-file" accept=".json" style="width:100%;margin-bottom:8px">
      <div class="modal-actions"><button class="btn btn-secondary" onclick="App.Renderer.closeModal()">取消</button><button class="btn btn-primary" onclick="App.ParentPanel.doImportData()">导入</button></div>
    `);
  },
  doImportData(){
    const file=document.getElementById('import-file').files[0];
    if(!file){App.Utils.toast('请选择文件','error');return;}
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const data=JSON.parse(e.target.result);
        Object.keys(data).forEach(key=>{
          if(key.startsWith('dlp_'))localStorage.setItem(key,JSON.stringify(data[key]));
        });
        App.Renderer.closeModal();
        App.Init.start();
        App.Utils.toast('数据导入成功','success');
      }catch(err){App.Utils.toast('导入失败: '+err.message,'error');}
    };
    reader.readAsText(file);
  },
  resetData(){
    if(!confirm('⚠️ 确定重置全部数据？此操作不可恢复！'))return;
    if(!confirm('再次确认：所有学习记录、种植田、宠物数据将被清空！'))return;
    for(let i=localStorage.length-1;i>=0;i--){
      const key=localStorage.key(i);
      if(key.startsWith('dlp_'))localStorage.removeItem(key);
    }
    App.Init.start();
    App.Utils.toast('数据已重置','success');
  },
  resetFarm(){
    const uid=App.DataStore.getCurrentUserId();
    if(!confirm('确定清除 '+App.DataStore.getCurrentUser().name+' 的种植田？所有作物和资源将归零。'))return;
    App.DataStore.set('dlp_farm_'+uid,null);
    App.DataStore.getFarmData(uid);
    App.Utils.toast('种植田已清除到初始状态','success');
    if(App.Router.currentRoute==='farm')App.Router.handleRoute();
  },
  resetPets(){
    const uid=App.DataStore.getCurrentUserId();
    if(!confirm('确定重置 '+App.DataStore.getCurrentUser().name+' 的宠物？'))return;
    App.DataStore.set('dlp_pets_'+uid,null);
    App.DataStore.getPetData(uid);
    App.Utils.toast('宠物已重置','success');
    if(App.Router.currentRoute==='pet')App.Router.handleRoute();
  },
  changePassword(){
    const newPwd=document.getElementById('new-parent-pwd').value.trim();
    if(!newPwd||newPwd.length<4){App.Utils.toast('密码至少4位','error');return;}
    const config=App.DataStore.getGameConfig();
    config.parentPassword=newPwd;
    App.DataStore.saveGameConfig(config);
    document.getElementById('new-parent-pwd').value='';
    App.Utils.toast('密码已修改','success');
  },
};

/* ===== 初始化 ===== */
App.Init = {
  start(){
    App.DataStore.initAll();
    const user=App.DataStore.getCurrentUser();
    document.body.setAttribute('data-user',user.id);
    App.Renderer.renderTopbar();
    App.Calendar.init();
    App.Renderer.renderModuleNav();
    const vt=document.getElementById('version-text');
    if(vt)vt.textContent=App.getVersionText();
    App.Router.init();
    if(App.Farm.gameTimer){clearInterval(App.Farm.gameTimer);}
    App.Farm.init();
    setInterval(()=>App.Pet.decayTick(),5000);
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){clearInterval(App.Farm.gameTimer);}
      else{App.Farm.init();if(App.Router.currentRoute)App.Router.handleRoute();}
    });
  }
};

document.addEventListener('DOMContentLoaded',()=>App.Init.start());
</script>
