<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>双娃学习打卡平台</title>
<style>
/* Emoji 字体回退方案 */
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Color+Emoji&display=swap');

/* ============ 1. CSS 变量与主题 ============ */
:root{
  --mc-grass:#A5D6A7;--mc-grass-dark:#66BB6A;--mc-dirt:#D7CCC8;--mc-dirt-dark:#A1887F;
  --mc-stone:#B0BEC5;--mc-wood:#D7CCC8;--mc-sky:#B3E5FC;--mc-sky-light:#E1F5FE;
  --mc-sun:#FFE082;--mc-sun-dark:#FFB300;--mc-leaf:#81C784;
  --mc-water:#4FC3F7;--mc-gold:#FFB300;--mc-red:#EF9A9A;
  --boy-color:#66BB6A;--girl-color:#F48FB1;
  --subj-chinese:#9CCC65;--subj-math:#FFB74D;--subj-english:#64B5F6;--subj-science:#BA68C8;
  --subj-bank:#A1887F;--subj-mistake:#E57373;--subj-sports:#FF7043;
  --bg-sky:linear-gradient(to bottom,#E1F5FE 0%,#B3E5FC 22%,#C8E6C9 22%,#A5D6A7 100%);
  --bg-card:#FAFAFA;--bg-card-2:#FFFFFF;
  --text-primary:#37474F;--text-secondary:#78909C;--text-light:#B0BEC5;
  --shadow-soft:0 3px 0 rgba(0,0,0,.06),0 5px 10px rgba(0,0,0,.05);
  --shadow-hover:0 6px 0 rgba(0,0,0,.06),0 10px 20px rgba(0,0,0,.08);
  --radius:14px;--radius-sm:8px;--radius-lg:20px;
  --theme-color:var(--boy-color);
  --font-main:'ZCOOL KuaiLe','Noto Color Emoji','Microsoft YaHei','PingFang SC','Apple Color Emoji','Segoe UI Emoji',sans-serif;
}
body[data-user="u_girl"]{--theme-color:var(--girl-color)}
body[data-user="u_boy"]{--theme-color:var(--boy-color)}

/* ============ 2. 基础重置 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-main);color:var(--text-primary);
  background:var(--bg-sky);background-attachment:fixed;
  min-height:100vh;overflow-x:hidden;
  -webkit-user-select:none;user-select:none;
}
input,textarea,select{font-family:inherit}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
img{max-width:100%}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.05)}
::-webkit-scrollbar-thumb{background:var(--mc-grass-dark);border-radius:4px}

/* ============ 3. 顶部固定栏 ============ */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;
  background:linear-gradient(135deg,#81C784,#66BB6A);
  border-bottom:3px solid #4CAF50;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
.topbar-users{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.topbar-user{
  display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;
  background:var(--bg-card-2);border-radius:var(--radius);border:3px solid transparent;
  cursor:pointer;transition:all .2s;max-width:200px;
}
.topbar-user.current{
  border-color:var(--theme-color);box-shadow:0 0 0 2px var(--bg-card-2),0 3px 0 var(--theme-color);
  transform:scale(1.05);
}
.topbar-user.other{opacity:.6}
.topbar-user.other:hover{opacity:1;transform:scale(1.02)}
.avatar{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background-size:cover;background-position:center;
  border:2px solid var(--mc-dirt-dark);position:relative;
}
.avatar-boy{background:linear-gradient(135deg,#42A5F5,#1565C0)}
.avatar-girl{background:linear-gradient(135deg,#F48FB1,#AD1457)}
.avatar::after{
  content:'';position:absolute;bottom:-2px;right:-2px;
  width:16px;height:16px;border-radius:50%;
  background:var(--mc-grass);border:2px solid #fff;font-size:10px;
}
.avatar-boy::after{background:#42A5F5;content:''}
.avatar-girl::after{background:#E91E63;content:''}
.avatar-boy::before{
  content:'👦';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;
}
.avatar-girl::before{
  content:'👧';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;
}
.avatar-emoji{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;line-height:1}
.avatar-picker{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px}
.avatar-option{
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  font-size:22px;border-radius:50%;cursor:pointer;border:3px solid transparent;
  background:var(--bg-card);transition:all .15s;
}
.avatar-option:hover{transform:scale(1.1);border-color:var(--mc-grass)}
.avatar-option.selected{border-color:var(--theme-color);background:var(--mc-sun);box-shadow:0 0 0 2px var(--theme-color)}
.avatar-upload-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar-preview{flex-shrink:0}
.avatar-preview-img,.avatar-preview-emoji{
  width:52px;height:52px;border-radius:50%;border:3px solid var(--theme-color);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  background-size:cover;background-position:center;background-color:var(--bg-card);
}
.upload-btn{
  display:inline-flex;align-items:center;gap:4px;padding:8px 14px;font-size:13px;font-weight:bold;
  background:var(--mc-sky);color:#fff;border-radius:var(--radius-sm);cursor:pointer;
  box-shadow:0 2px 0 var(--mc-water);transition:all .15s;
}
.upload-btn:hover{transform:translateY(-1px);box-shadow:0 3px 0 var(--mc-water)}
.upload-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--mc-water)}
.icon-editor{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.icon-preview-box{width:48px;height:48px;border:3px solid var(--theme-color);border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--bg-card);flex-shrink:0;overflow:hidden}
.icon-inputs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.svg-icon-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;margin-top:6px;max-height:120px;overflow-y:auto;border:1px solid var(--mc-dirt);border-radius:8px;padding:6px}
.svg-icon-option{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;border:2px solid transparent;background:var(--bg-card);transition:all .15s}
.svg-icon-option:hover{border-color:var(--mc-grass);transform:scale(1.05)}
.svg-icon-option.selected{border-color:var(--theme-color);background:var(--mc-sun)}
.water-reminder-banner{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);border:2px solid #42A5F5;border-radius:var(--radius);padding:8px 14px;margin:8px 0;font-size:13px;font-weight:bold;color:#1565C0;text-align:center;box-shadow:0 2px 0 #42A5F5;animation:waterPulse 2s ease-in-out infinite}
@keyframes waterPulse{0%,100%{box-shadow:0 2px 0 #42A5F5}50%{box-shadow:0 2px 0 #42A5F5,0 0 8px rgba(66,165,245,.3)}}
.user-info{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.user-name{font-size:14px;font-weight:bold;color:var(--text-primary);white-space:nowrap}
.user-grade{font-size:11px;color:var(--text-secondary)}
.switch-btn{
  font-size:20px;padding:4px 8px;background:var(--mc-sun);border-radius:50%;
  box-shadow:0 2px 0 var(--mc-sun-dark);transition:transform .2s;
}
.switch-btn:hover{transform:rotate(180deg) scale(1.1)}
.topbar-actions{display:flex;gap:4px;flex-shrink:0}
.action-btn{
  padding:6px 10px;font-size:12px;font-weight:bold;color:#fff;
  background:var(--theme-color);border-radius:var(--radius-sm);
  box-shadow:0 3px 0 rgba(0,0,0,.2);transition:all .15s;white-space:nowrap;
}
.action-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.action-btn.parent-btn{background:var(--mc-dirt-dark)}

/* ============ 4. 日历组件 ============ */
#calendar-bar{
  position:fixed;top:56px;left:0;right:0;z-index:99;
  display:flex;align-items:center;gap:6px;padding:6px 12px;
  background:var(--bg-card-2);border-bottom:3px solid var(--mc-grass);
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.cal-nav{
  width:32px;height:32px;font-size:16px;font-weight:bold;color:#fff;
  background:var(--mc-grass);border-radius:50%;box-shadow:0 2px 0 var(--mc-grass-dark);
  flex-shrink:0;transition:all .15s;
}
.cal-nav:hover{background:var(--mc-grass-dark);transform:scale(1.1)}
.cal-nav:active{transform:translateY(2px);box-shadow:none}
.cal-days{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.cal-days::-webkit-scrollbar{display:none}
.cal-day{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:52px;height:44px;padding:2px 4px;border-radius:var(--radius-sm);
  cursor:pointer;transition:all .15s;flex-shrink:0;position:relative;
  background:var(--bg-card);border:2px solid transparent;
}
.cal-day .cal-weekday{font-size:10px;color:var(--text-light)}
.cal-day .cal-date{font-size:14px;font-weight:bold;color:var(--text-primary)}
.cal-day.today{
  background:var(--mc-sun);border-color:var(--mc-sun-dark);
  animation:dayPulse 2s ease-in-out infinite;
}
@keyframes dayPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,213,79,.5)}50%{box-shadow:0 0 0 6px rgba(255,213,79,0)}}
.cal-day.selected{background:var(--theme-color);border-color:var(--theme-color)}
.cal-day.selected .cal-weekday,.cal-day.selected .cal-date{color:#fff}
.cal-day .cal-dot{
  position:absolute;bottom:2px;width:6px;height:6px;border-radius:50%;background:var(--mc-red);
}
.cal-day.has-checkin .cal-dot{background:var(--mc-grass-dark)}

/* ============ 5. 模块导航（左侧边栏） ============ */
#module-nav{
  position:fixed;top:108px;left:0;bottom:0;width:90px;z-index:98;
  display:flex;flex-direction:column;gap:6px;padding:10px 6px;
  overflow-y:auto;overflow-x:hidden;
  background:rgba(255,255,255,.92);
  border-right:3px solid var(--mc-grass);
  scrollbar-width:thin;scrollbar-color:var(--mc-grass) transparent;
}
#module-nav::-webkit-scrollbar{width:4px}
#module-nav::-webkit-scrollbar-thumb{background:var(--mc-grass);border-radius:2px}
.module-entry{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 4px;border-radius:var(--radius);font-size:11px;font-weight:bold;
  text-align:center;cursor:pointer;transition:all .15s;width:100%;
  background:var(--bg-card-2);border:2px solid var(--mc-dirt-dark);color:var(--text-primary);
  box-shadow:0 3px 0 var(--mc-dirt);
}
.module-entry:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--mc-dirt)}
.module-entry:active{transform:translateY(2px);box-shadow:0 1px 0 var(--mc-dirt)}
.module-entry.active{background:var(--theme-color);color:#fff;border-color:var(--theme-color)}
.module-entry .mod-emoji{font-size:22px}

/* ============ 6. 页面容器 ============ */
#page-container{padding:120px 12px 60px 102px;min-height:100vh;animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ============ 7. 主页仪表盘 ============ */
.dashboard-cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.dash-card{
  flex:1;min-width:130px;padding:12px;text-align:center;
  background:var(--bg-card-2);border-radius:var(--radius);
  border:3px solid var(--theme-color);box-shadow:var(--shadow-soft);
  transition:transform .2s;
}
.dash-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.dash-value{font-size:22px;font-weight:bold;color:var(--text-primary)}
.dash-label{font-size:12px;color:var(--text-secondary);margin-top:2px}
.module-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:16px;
}
.module-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 8px;cursor:pointer;border-radius:var(--radius);
  background:var(--bg-card-2);border:3px solid var(--card-color,var(--theme-color));
  box-shadow:0 4px 0 var(--card-color,var(--theme-color)),0 6px 12px rgba(0,0,0,.08);
  transition:all .2s;
}
.module-card:hover{transform:translateY(-4px);box-shadow:0 8px 0 var(--card-color,var(--theme-color)),0 10px 20px rgba(0,0,0,.12)}
.module-card:active{transform:translateY(2px);box-shadow:0 2px 0 var(--card-color,var(--theme-color))}
.module-card .mod-icon{font-size:36px;margin-bottom:6px}
.module-card .mod-name{font-size:14px;font-weight:bold;color:var(--text-primary)}

/* ============ 8. 学习任务页面 ============ */
.page-title{font-size:20px;font-weight:bold;color:var(--text-primary);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.task-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.task-card{
  display:flex;align-items:center;gap:12px;padding:12px;
  background:var(--bg-card-2);border-radius:var(--radius);
  border:2px solid var(--mc-dirt-dark);box-shadow:0 3px 0 var(--mc-dirt-dark);
  cursor:pointer;transition:all .15s;
}
.task-card:hover{border-color:var(--theme-color);box-shadow:0 3px 0 var(--theme-color)}
.task-card.completed{border-color:var(--mc-grass);box-shadow:0 3px 0 var(--mc-grass-dark);background:#F1F8E9}
.task-check{flex-shrink:0}
.check-box{
  width:28px;height:28px;border-radius:6px;border:3px solid var(--mc-dirt-dark);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;
  background:#fff;transition:all .2s;
}
.check-box.checked{background:var(--mc-grass);border-color:var(--mc-grass-dark);color:#fff;animation:checkPop .3s ease-out}
@keyframes checkPop{0%{transform:scale(0) rotate(-45deg)}70%{transform:scale(1.3) rotate(0)}100%{transform:scale(1) rotate(0)}}
.task-info{flex:1;min-width:0}
.task-name{font-size:15px;font-weight:bold;color:var(--text-primary)}
.task-meta{font-size:11px;color:var(--text-secondary)}
.task-status{flex-shrink:0;display:flex;align-items:center;gap:4px}
.badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.badge-done{background:var(--mc-grass);color:#fff}
.badge-pending{background:#E0E0E0;color:var(--text-secondary)}
.add-custom-btn{
  display:flex;align-items:center;gap:6px;padding:10px 16px;
  background:var(--mc-sky);color:#fff;font-weight:bold;border-radius:var(--radius);
  box-shadow:0 3px 0 var(--mc-water);transition:all .15s;
}
.add-custom-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--mc-water)}
.add-custom-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--mc-water)}

/* ============ 8.4 每日鼓励 & 每日科普 ============ */
.encourage-banner{
  background:linear-gradient(135deg,var(--mc-sky-light),var(--mc-sky));
  border:2px solid var(--mc-water);border-radius:var(--radius);
  padding:10px 16px;margin-bottom:14px;text-align:center;
  box-shadow:0 3px 0 var(--mc-water);position:relative;overflow:hidden;
}
.encourage-banner::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  animation:shine 4s ease-in-out infinite}
@keyframes shine{0%{left:-100%}50%,100%{left:100%}}
.encourage-text{font-size:15px;font-weight:bold;color:var(--text-primary);position:relative;z-index:1}
.science-card{
  background:linear-gradient(135deg,#E8F5E9,#C8E6C9);
  border:2px solid var(--mc-grass-dark);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:14px;box-shadow:0 3px 0 var(--mc-grass-dark);
}
.science-header{font-size:14px;font-weight:bold;color:var(--mc-grass-dark);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.science-body{display:flex;gap:12px;align-items:flex-start}
.science-icon{font-size:36px;flex-shrink:0;line-height:1}
.science-content-wrap{flex:1;min-width:0}
.science-title{font-size:14px;font-weight:bold;color:var(--text-primary);margin-bottom:4px}
.science-content{font-size:12px;color:var(--text-secondary);line-height:1.6}
.science-refresh{
  margin-top:8px;padding:4px 12px;font-size:12px;font-weight:bold;
  background:var(--mc-grass);color:#fff;border:none;border-radius:var(--radius-sm);
  cursor:pointer;box-shadow:0 2px 0 var(--mc-grass-dark);transition:all .15s;
}
.science-refresh:hover{transform:translateY(-1px);box-shadow:0 3px 0 var(--mc-grass-dark)}
.science-refresh:active{transform:translateY(1px);box-shadow:0 1px 0 var(--mc-grass-dark)}

/* ============ 8.5 运动板块 ============ */
.sports-stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.stat-mini-card{
  padding:10px 8px;text-align:center;border-radius:var(--radius);
  background:var(--bg-card-2);border:2px solid var(--subj-sports);
  box-shadow:0 3px 0 var(--subj-sports);transition:all .15s;
}
.stat-mini-card:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--subj-sports)}
.stat-mini-card .stat-icon{font-size:22px;margin-bottom:2px}
.stat-mini-card .stat-num{font-size:18px;font-weight:bold;color:var(--text-primary)}
.stat-mini-card .stat-label{font-size:11px;color:var(--text-secondary);margin-top:2px}
.sports-chart{background:var(--bg-card-2);border-radius:var(--radius);padding:14px;margin-bottom:14px;border:2px solid var(--mc-dirt-dark);box-shadow:var(--shadow-soft)}
.chart-title{font-size:14px;font-weight:bold;color:var(--text-primary);margin-bottom:10px}
.chart-bars{display:flex;gap:6px;align-items:flex-end;height:100px;padding-bottom:20px;position:relative}
.chart-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%}
.chart-bar{
  width:100%;max-width:40px;border-radius:6px 6px 0 0;min-height:4px;
  transition:height .3s ease-out;position:relative;
}
.chart-bar-val{font-size:10px;color:var(--text-secondary);white-space:nowrap}
.chart-bar-label{font-size:11px;color:var(--text-secondary)}
.achievement-wall{background:var(--bg-card-2);border-radius:var(--radius);padding:14px;border:2px solid var(--mc-dirt-dark);box-shadow:var(--shadow-soft)}
.achievement-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin-top:10px}
.achievement-badge{
  display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:var(--radius-sm);
  text-align:center;transition:all .2s;
}
.achievement-badge.unlocked{background:linear-gradient(135deg,#FFF8E1,#FFE0B2);border:2px solid var(--mc-gold);box-shadow:0 2px 6px rgba(255,179,0,.2)}
.achievement-badge.locked{background:#F5F5F5;border:2px solid #E0E0E0;opacity:.6;filter:grayscale(.8)}
.achievement-badge .badge-icon{font-size:28px;line-height:1}
.achievement-badge.locked .badge-icon::after{content:'🔒';position:absolute;font-size:14px;margin-left:-20px;margin-top:14px}
.achievement-badge .badge-name{font-size:10px;font-weight:bold;color:var(--text-primary);margin-top:3px;line-height:1.2}
.achievement-badge .badge-desc{font-size:9px;color:var(--text-secondary);margin-top:1px;line-height:1.2}
.sports-section-title{font-size:15px;font-weight:bold;color:var(--text-primary);margin:14px 0 8px;display:flex;align-items:center;gap:6px}

/* ============ 9. 习题库 ============ */
.subject-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab-btn{
  padding:8px 16px;font-size:13px;font-weight:bold;border-radius:var(--radius-sm);
  background:var(--bg-card-2);border:2px solid var(--mc-dirt-dark);color:var(--text-primary);
  box-shadow:0 2px 0 var(--mc-dirt-dark);transition:all .15s;
}
.tab-btn:hover{transform:translateY(-1px)}
.tab-btn:active{transform:translateY(2px);box-shadow:none}
.tab-btn.active{background:var(--theme-color);color:#fff;border-color:var(--theme-color)}
.lesson-item{
  padding:10px 14px;margin-bottom:6px;background:var(--bg-card-2);
  border-radius:var(--radius-sm);border:2px solid var(--mc-dirt-dark);
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .15s;
}
.lesson-item:hover{border-color:var(--theme-color)}
.lesson-title{font-weight:bold;color:var(--text-primary)}
.lesson-count{font-size:12px;color:var(--text-secondary)}
.grade-group{margin-bottom:14px}
.grade-header{
  font-size:15px;font-weight:bold;color:#fff;background:var(--theme-color);
  padding:6px 12px;border-radius:var(--radius-sm);margin-bottom:6px;
  display:flex;align-items:center;justify-content:space-between;
}
.grade-meta{font-size:11px;font-weight:normal;opacity:.9}
.q-item{
  padding:12px;margin-bottom:8px;background:var(--bg-card-2);
  border-radius:var(--radius-sm);border-left:4px solid var(--mc-grass-dark);
}
.q-content{font-weight:bold;margin-bottom:8px;color:var(--text-primary)}
.q-options{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.q-option{padding:6px 10px;background:#f5f5f5;border-radius:6px;font-size:13px}
.q-option.correct{background:#C8E6C9;font-weight:bold}
.q-answer{font-size:12px;color:var(--mc-grass-dark);font-weight:bold}
.parent-action-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ============ 9.5 知识库 ============ */
.kb-search-box{display:flex;gap:6px;margin-bottom:12px}
.kb-search-box input{
  flex:1;padding:8px 12px;border:2px solid var(--mc-dirt-dark);
  border-radius:var(--radius-sm);font-size:14px;font-family:inherit;
}
.kb-search-box input:focus{outline:none;border-color:var(--theme-color)}
.kb-search-clear{
  padding:8px 14px;font-size:14px;font-weight:bold;color:#666;
  background:#E0E0E0;border:none;border-radius:var(--radius-sm);cursor:pointer;
}
.kb-search-clear:hover{background:#BDBDBD}
.kb-result-count{font-size:12px;color:var(--text-secondary);margin-bottom:8px;padding:4px 0}
.kb-point-item{
  padding:10px 14px;margin-bottom:6px;background:var(--bg-card-2);
  border-radius:var(--radius-sm);border-left:4px solid var(--mc-water);
  transition:all .15s;
}
.kb-point-item:hover{border-color:var(--theme-color);background:#F5FAFF}
.kb-point-title{font-weight:bold;color:var(--text-primary);margin-bottom:4px;font-size:14px}
.kb-point-content{font-size:13px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.kb-point-meta{font-size:11px;color:var(--text-light);margin-top:4px}
.kb-point-tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.kb-point-tag{padding:2px 8px;font-size:11px;background:#E3F2FD;border-radius:12px;color:#1565C0}
.kb-point-actions{margin-top:8px;display:flex;gap:6px}
.kb-search-result-group{
  margin-bottom:14px;padding:10px 12px;background:var(--bg-card);
  border-radius:var(--radius-sm);border:1px dashed var(--mc-dirt-dark);
}
.kb-search-result-path{font-size:12px;color:var(--text-secondary);margin-bottom:8px}
.highlight{background:#FFE082;border-radius:3px;padding:0 2px;font-weight:bold}

/* 知识点卡片弹窗 */
.kb-card{max-width:520px;margin:0 auto}
.kb-card-header{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  padding-bottom:12px;border-bottom:2px dashed var(--mc-dirt-dark);
}
.kb-card-icon{
  width:48px;height:48px;flex-shrink:0;
  background:linear-gradient(135deg,#E3F2FD,#BBDEFB);
  border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
  font-size:26px;
}
.kb-card-title{font-size:18px;font-weight:bold;color:var(--text-primary);line-height:1.4}
.kb-card-path{font-size:12px;color:var(--text-secondary);margin-top:4px}
.kb-card-body{
  font-size:14px;color:var(--text-primary);line-height:1.8;
  padding:14px;background:#FAFAFA;border-radius:var(--radius-sm);
  white-space:pre-wrap;word-break:break-word;margin-bottom:12px;
  border-left:4px solid var(--mc-water);
}
/* 古诗文排版 */
.kb-poem-title{text-align:center;font-size:20px;font-weight:bold;color:var(--text-primary);margin-bottom:4px;letter-spacing:2px}
.kb-poem-author{text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:12px;font-style:italic}
.kb-poem-lines{text-align:center;font-size:16px;color:var(--text-primary);line-height:2.2;letter-spacing:1px}
.kb-poem-line{display:block}
.kb-card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.kb-card-tag{
  padding:4px 12px;font-size:12px;background:#E3F2FD;
  border-radius:14px;color:#1565C0;font-weight:bold;
}
.kb-card-footer{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:10px;border-top:1px solid var(--mc-dirt);
  font-size:11px;color:var(--text-light);
}
.kb-card-stats{display:flex;gap:12px}

/* ============ 10. 种植田 ============ */
.resource-bar{
  display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding:10px;
  background:var(--bg-card-2);border-radius:var(--radius);border:3px solid var(--mc-wood);
  box-shadow:var(--shadow-soft);
}
.resource-chip{
  display:flex;align-items:center;gap:4px;padding:4px 10px;
  background:#F1F8E9;border-radius:20px;font-size:13px;font-weight:bold;
}
.farm-layout{
  display:flex;gap:8px;align-items:flex-start;justify-content:center;max-width:800px;margin:0 auto;
}
.farm-center{flex:1;max-width:600px;}
.farm-decor{
  width:70px;flex-shrink:0;background:var(--bg-card-2);border-radius:var(--radius);
  border:2px solid var(--mc-dirt-dark);padding:6px;display:flex;flex-direction:column;gap:4px;
  box-shadow:var(--shadow-soft);
}
.farm-decor.right{border-color:var(--theme-color)}
.decor-title{font-size:11px;font-weight:bold;text-align:center;color:var(--text-secondary);padding-bottom:4px;border-bottom:1px dashed var(--mc-dirt-dark)}
.decor-item{
  font-size:28px;text-align:center;padding:4px;border-radius:6px;cursor:pointer;
  transition:all .15s;background:#FAFAFA;
}
.decor-item:hover{transform:scale(1.1);background:var(--mc-sky-light)}
.decor-item.pet{font-size:32px}
.decor-empty{font-size:10px;color:var(--text-light);text-align:center;padding:8px 2px}
.farm-grid{
  display:grid;grid-template-columns:repeat(var(--grid-cols,5),1fr);gap:6px;
}
.plot{
  aspect-ratio:1;border-radius:var(--radius-sm);position:relative;cursor:pointer;
  background:var(--mc-dirt);
  background-image:linear-gradient(to bottom,var(--mc-grass) 0%,var(--mc-grass) 20%,var(--mc-dirt) 20%);
  border:3px solid var(--mc-grass-dark);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;overflow:visible;
}
.plot:hover{border-color:var(--mc-sun);transform:scale(1.05)}
.plot.empty .plot-content::before{content:'➕';font-size:20px;opacity:.3}
.plot.withered{filter:grayscale(1) opacity(.5);border-color:#666}
.plot-content{font-size:32px;position:relative;z-index:1;animation:growIn .5s ease-out}
@keyframes growIn{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.plant-sunflower{animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.plant-money-tree{animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 4px var(--mc-gold))}to{filter:drop-shadow(0 0 12px var(--mc-gold))}}
.plot-badge{
  position:absolute;top:-6px;right:-6px;width:24px;height:24px;
  background:var(--mc-sun);border:2px solid #fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;
  box-shadow:0 2px 4px rgba(0,0,0,.3);animation:bounce 1s ease-in-out infinite;
}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.plot-status-badge{
  position:absolute;font-size:10px;font-weight:bold;padding:1px 4px;border-radius:8px;
  border:1px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);animation:bounce 1.5s ease-in-out infinite;
}
.plot-status-badge.bug{top:-6px;left:-6px;background:#FFCDD2;color:#C62828}
.plot-status-badge.weed{bottom:8px;right:-6px;background:#FFE0B2;color:#E65100}
.plot-status-badge.water{bottom:8px;left:-6px;background:#BBDEFB;color:#1565C0}
.resource-bar.low-sunlight{animation:flashRed 1s ease-in-out infinite}
@keyframes flashRed{0%,100%{background:var(--bg-card-2)}50%{background:#FFCDD2}}
.plot-health-bar{
  position:absolute;bottom:-8px;left:2px;right:2px;height:6px;
  background:rgba(255,255,255,.5);border-radius:3px;overflow:hidden;
}
.plot-health-fill{height:100%;background:var(--mc-grass);transition:width .5s}
.farm-actions{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.plant-menu{
  display:flex;gap:8px;padding:12px;background:var(--bg-card-2);border-radius:var(--radius);
  border:3px solid var(--mc-wood);margin-top:8px;justify-content:center;flex-wrap:wrap;
}
.plant-option{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;
  border-radius:var(--radius-sm);background:#F1F8E9;border:2px solid var(--mc-grass-dark);
  cursor:pointer;transition:all .15s;font-size:13px;
}
.plant-option:hover{border-color:var(--mc-sun);transform:scale(1.05)}
.plant-option:disabled{opacity:.5;cursor:not-allowed}
.plant-option .plant-emoji{font-size:28px}

/* ============ 11. 宠物 ============ */
.pet-area{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.pet-card{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;
  background:var(--bg-card-2);border-radius:var(--radius-lg);border:3px solid var(--mc-wood);
  box-shadow:var(--shadow-soft);min-width:200px;
}
.pet-display{
  width:120px;height:120px;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:80px;
}
.pet-display .pet-emoji{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.pet-name{font-size:16px;font-weight:bold;color:var(--text-primary)}
.stat-bar{display:flex;align-items:center;gap:6px;width:100%;font-size:12px}
.stat-bar .bar{flex:1;height:10px;background:#E0E0E0;border-radius:5px;overflow:hidden}
.stat-bar .bar-fill{height:100%;background:var(--mc-sun-dark);transition:width .5s}
.stat-bar .bar-fill.happiness{background:var(--mc-grass)}
.pet-actions{display:flex;gap:8px;margin-top:4px}

/* ============ 12. 商城 ============ */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.shop-card{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;
  background:var(--bg-card-2);border-radius:var(--radius);border:3px solid var(--mc-wood);
  box-shadow:var(--shadow-soft);transition:all .15s;
}
.shop-card:hover{transform:translateY(-3px)}
.shop-card .shop-emoji{font-size:36px}
.shop-card .shop-name{font-size:13px;font-weight:bold;text-align:center}
.shop-card .shop-desc{font-size:11px;color:var(--text-secondary);text-align:center}
.shop-card .shop-price{font-size:14px;font-weight:bold;color:var(--mc-gold)}
.btn-buy{
  padding:6px 16px;font-size:12px;font-weight:bold;color:#fff;
  background:var(--mc-gold);border-radius:var(--radius-sm);box-shadow:0 3px 0 #E65100;
  transition:all .15s;
}
.btn-buy:active{transform:translateY(2px);box-shadow:0 1px 0 #E65100}
.btn-buy:disabled{background:#BDBDBD;box-shadow:0 3px 0 #757575;cursor:not-allowed}

/* ============ 13. 家长后台 ============ */
.parent-section{margin-bottom:16px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:13px;font-weight:bold;margin-bottom:4px;color:var(--text-primary)}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:8px 12px;font-size:13px;border:2px solid var(--mc-dirt-dark);
  border-radius:var(--radius-sm);background:#fff;
}
.form-group textarea{resize:vertical;min-height:60px}
.config-row{
  display:flex;align-items:center;justify-content:space-between;padding:8px 12px;margin-bottom:4px;
  background:var(--bg-card-2);border-radius:var(--radius-sm);border:1px solid var(--mc-dirt);
}
.config-row label{font-size:13px;color:var(--text-primary)}
.config-row input{width:80px;text-align:center;padding:4px}
.manage-row{
  display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:4px;
  background:var(--bg-card-2);border-radius:var(--radius-sm);border:1px solid var(--mc-dirt);
}
.manage-row .item-name{flex:1;font-size:13px;font-weight:bold}
.manage-row .item-price{font-size:12px;color:var(--mc-gold);font-weight:bold}
.manage-row button{padding:4px 10px;font-size:11px;border-radius:6px}

/* ============ 14. 弹窗/Toast ============ */
#modal-layer{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;pointer-events:none}
#modal-layer .modal-overlay{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
  padding:16px;pointer-events:auto;animation:overlayIn .2s ease-out;
}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.modal-content{
  background:var(--bg-card-2);border-radius:var(--radius-lg);
  border:4px solid var(--mc-wood);box-shadow:0 8px 32px rgba(0,0,0,.3);
  padding:20px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;
  animation:modalIn .3s ease-out;
}
@keyframes modalIn{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-content h3{font-size:18px;margin-bottom:12px;color:var(--text-primary)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn{
  padding:8px 20px;font-size:14px;font-weight:bold;border-radius:var(--radius-sm);
  box-shadow:0 3px 0 rgba(0,0,0,.2);transition:all .15s;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn-primary{background:var(--theme-color);color:#fff}
.btn-secondary{background:#E0E0E0;color:var(--text-secondary)}
.btn-danger{background:var(--mc-red);color:#fff}
#toast-layer{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:2000;pointer-events:none}
.toast{
  padding:10px 20px;margin-top:6px;background:var(--text-primary);color:#fff;
  border-radius:var(--radius);font-size:14px;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.3);
  animation:toastIn .3s ease-out;max-width:90vw;text-align:center;
}
.toast.error{background:var(--mc-red)}
.toast.success{background:var(--mc-grass-dark)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ============ 15. 通用 ============ */
.section-card{
  background:var(--bg-card-2);border-radius:var(--radius);padding:14px;margin-bottom:12px;
  border:3px solid var(--mc-wood);box-shadow:var(--shadow-soft);
}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-secondary)}
.empty-state .empty-icon{font-size:48px;opacity:.3;margin-bottom:8px}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat-chip{padding:4px 12px;background:#F1F8E9;border-radius:20px;font-size:13px;font-weight:bold}

/* ============ 16. 响应式 ============ */
@media(max-width:768px){
  .module-grid{grid-template-columns:repeat(3,1fr)}
  .dashboard-cards{flex-wrap:wrap}
  .dash-card{min-width:100px}
  .topbar-actions .action-btn{padding:6px 8px;font-size:11px}
  .farm-layout{flex-direction:row;gap:4px}
  .farm-decor{width:56px}
  .decor-item{font-size:22px}
  #module-nav{width:72px}
  #page-container{padding-left:80px}
  .module-entry{font-size:10px;padding:8px 2px}
  .module-entry .mod-emoji{font-size:18px}
}
@media(max-width:480px){
  .module-grid{grid-template-columns:repeat(2,1fr)}
  .farm-layout{flex-direction:column;align-items:center}
  .farm-decor{width:100%;flex-direction:row;flex-wrap:wrap}
  .decor-title{width:100%}
  .decor-item{font-size:24px}
  .farm-center{width:100%}
  .topbar-user .user-info{display:none}
  .cal-day{min-width:44px}
  #module-nav{width:60px}
  #page-container{padding-left:66px}
  .module-entry{font-size:0;padding:6px 2px}
  .module-entry .mod-emoji{font-size:20px}
  .module-entry .mod-name{display:none}
}
/* ============ 翻牌记忆游戏 ============ */
.mem-game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.mem-card{aspect-ratio:1;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;transition:all .3s;user-select:none;position:relative}
.mem-card.back{background:linear-gradient(135deg,var(--mc-sky),var(--mc-sky-light));border:3px solid var(--mc-water)}
.mem-card.back::after{content:'?';font-size:28px;color:#fff;font-weight:bold;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.mem-card.flipped{background:var(--mc-sun);border:3px solid var(--mc-sun-dark);transform:scale(1.05)}
.mem-card.matched{background:var(--mc-grass);border:3px solid var(--mc-grass-dark);transform:scale(1);opacity:.7;cursor:default}
.mem-card.matched::after{content:'✓';position:absolute;top:2px;right:4px;font-size:12px;color:#fff}
.mem-game-info{display:flex;justify-content:space-around;font-size:14px;font-weight:bold;margin-bottom:8px;padding:6px;background:var(--bg-card-2);border-radius:8px}
/* ============ 版本角标 ============ */
#version-badge{position:fixed;right:8px;bottom:8px;z-index:9999;font-size:11px;color:var(--text-secondary,#666);background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.08);border-radius:10px;padding:3px 8px;cursor:pointer;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.08);user-select:none;opacity:.78;transition:opacity .2s}
#version-badge:hover{opacity:1}
#version-badge:active{transform:scale(.96)}
</style>

<body data-user="u_boy">
<div id="app">
  <header id="topbar"></header>
  <div id="calendar-bar"></div>
  <nav id="module-nav"></nav>
  <main id="page-container"></main>
  <div id="modal-layer"></div>
  <div id="toast-layer"></div>
  <div id="version-badge" onclick="App.Utils.copyVersion()" title="点击复制版本信息，便于核对文件是否为最新">📦 <span id="version-text"></span></div>
</div>
<script>
/* ============================================================
 * 双娃学习打卡平台 - 核心应用
 * 架构: 命名空间模块化 + SPA Hash路由 + LocalStorage
 * ============================================================ */
const App = {};

/* ===== 版本信息（每次更新请同步修改 BUILD_DATE，便于核对文件是否为最新）===== */
App.VERSION = 'v3.0';
App.BUILD_DATE = '2026-07-30';
App.getVersionText = function(){ return '📦 '+this.VERSION+' · '+this.BUILD_DATE; };

/* ===== 工具函数 ===== */
App.Utils = {
  todayStr(){
    const d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  },
  dateStr(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  },
  dateOffset(dateStr,days){
    const d=new Date(dateStr);d.setDate(d.getDate()+days);return this.dateStr(d);
  },
  genId(prefix){return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);},
  toast(msg,type){
    const layer=document.getElementById('toast-layer');
    const t=document.createElement('div');
    t.className='toast'+(type?' '+type:'');
    t.textContent=msg;
    layer.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(20px)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300);},2500);
  },
  weekdayName(i){return['日','一','二','三','四','五','六'][i];},
  weekdayFull(i){return['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][i];},
  escape(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');},

  /* --- 习题库 --- */
  getQuestionBank(){
    let b=this.get('dlp_question_bank');
    if(!b){b=this.initQuestionBank();}
    return b;
  },
  initQuestionBank(){
    const b={
      version:1,
      subjects:{
        chinese:{name:'语文',textbook:'人教版',lessons:[]},
        math:{name:'数学',textbook:'人教版',lessons:[]},
        english:{name:'英语',textbook:'科教版广州专版',lessons:[]},
        science:{name:'科学',textbook:'科教版',lessons:[]},
      }
    };
    this.set('dlp_question_bank',b);
    return b;
  },
  saveQuestionBank(b){this.set('dlp_question_bank',b);},
  findOrCreateLesson(bank,subjectKey,grade,lessonNumber,lessonTitle){
    let s=bank.subjects[subjectKey];
    if(!s){s={name:subjectKey,textbook:'',lessons:[]};bank.subjects[subjectKey]=s;}
    let lesson=s.lessons.find(l=>l.grade===grade&&l.lessonNumber===lessonNumber);
    if(!lesson){
      lesson={lessonId:App.Utils.genId('lesson'),grade,lessonNumber,lessonTitle,questions:[]};
      s.lessons.push(lesson);
      s.lessons.sort((a,c)=>a.grade-c.grade||a.lessonNumber-c.lessonNumber);
    }
    return lesson;
  },
  getQuestion(qid){
    const bank=this.getQuestionBank();
    for(const s of Object.values(bank.subjects)){
      for(const l of s.lessons){
        const q=l.questions.find(x=>x.questionId===qid);
        if(q)return q;
      }
    }
    return null;
  },

  findOrCreateKnowledgeLesson(bank,subjectKey,grade,lessonNumber,lessonTitle){
    let s=bank.subjects[subjectKey];
    if(!s){s={name:subjectKey,textbook:'',lessons:[]};bank.subjects[subjectKey]=s;}
    let lesson=s.lessons.find(l=>l.grade===grade&&l.lessonNumber===lessonNumber);
    if(!lesson){
      lesson={lessonId:App.Utils.genId('kl'),grade,lessonNumber,lessonTitle,points:[]};
      s.lessons.push(lesson);
      s.lessons.sort((a,c)=>a.grade-c.grade||a.lessonNumber-c.lessonNumber);
    }
    if(lessonTitle&&!lesson.lessonTitle)lesson.lessonTitle=lessonTitle;
    return lesson;
  },
  findKnowledgePoint(pid){
    const bank=this.getKnowledgeBase();
    for(const s of Object.values(bank.subjects)){
      for(const l of s.lessons){
        const p=l.points.find(x=>x.pointId===pid);
        if(p)return {point:p,lesson:l,subject:s,bank};
      }
    }
    return null;
  },

  /* --- 错题本 --- */
  getMistakes(uid){return this.get('dlp_mistakes_'+uid)||{userId:uid,mistakes:[]};},
  saveMistakes(uid,data){this.set('dlp_mistakes_'+uid,data);},
  addMistake(uid,questionId,userAnswer){
    const mistakes=this.getMistakes(uid);
    const q=this.getQuestion(questionId);
    if(!q)return;
    let subjectKey,lessonId,lessonTitle;
    const bank=this.getQuestionBank();
    for(const[sk,sv]of Object.entries(bank.subjects)){
      const lesson=sv.lessons.find(l=>l.questions.some(x=>x.questionId===questionId));
      if(lesson){subjectKey=sk;lessonId=lesson.lessonId;lessonTitle=lesson.lessonTitle;break;}
    }
    let m=mistakes.mistakes.find(x=>x.questionId===questionId);
    if(m){
      m.wrongCount++;m.lastWrongAt=Date.now();m.userAnswer=userAnswer;
      m.reviewHistory.push({date:App.Utils.todayStr(),result:'wrong'});
      m.mastered=false;m.masteredAt=null;
    }else{
      mistakes.mistakes.push({
        mistakeId:App.Utils.genId('m'),questionId,subject:subjectKey,lessonId,lessonTitle,
        questionContent:q.content,correctAnswer:q.answer,userAnswer,
        wrongCount:1,firstWrongAt:Date.now(),lastWrongAt:Date.now(),
        mastered:false,masteredAt:null,
        reviewHistory:[{date:App.Utils.todayStr(),result:'wrong'}]
      });
    }
    this.saveMistakes(uid,mistakes);
  },
  markMastered(uid,mistakeId){
    const mistakes=this.getMistakes(uid);
    const m=mistakes.mistakes.find(x=>x.mistakeId===mistakeId);
    if(m){
      m.mastered=true;m.masteredAt=Date.now();
      m.reviewHistory.push({date:App.Utils.todayStr(),result:'correct'});
      this.saveMistakes(uid,mistakes);
    }
  },

  getShopItem(itemId){return this.getShopData().items.find(i=>i.itemId===itemId)||null;},

  /* --- 运动数据 --- */
  getSportsData(uid){
    let s=this.get('dlp_sports_'+uid);
    if(!s){
      s={userId:uid,
        stats:{rope_skip:0,running:0,situp:0,stretching:0,ballgame:0},
        dailyLog:{},
        achievements:[],
        totalCheckins:0,
        earlyBirdCount:0,
      };
      this.set('dlp_sports_'+uid,s);
    }
    if(!s.stats)s.stats={rope_skip:0,running:0,situp:0,stretching:0,ballgame:0};
    if(!s.dailyLog)s.dailyLog={};
    if(!s.achievements)s.achievements=[];
    if(s.totalCheckins===undefined)s.totalCheckins=0;
    if(s.earlyBirdCount===undefined)s.earlyBirdCount=0;
    return s;
  },
  saveSportsData(uid,data){this.set('dlp_sports_'+uid,data);},
  recordSportsStats(uid,taskType,value){
    const data=this.getSportsData(uid);
    const today=App.Utils.todayStr();
    if(!data.dailyLog[today])data.dailyLog[today]={rope_skip:0,running:0,situp:0,stretching:0,ballgame:0};
    data.dailyLog[today][taskType]=(data.dailyLog[today][taskType]||0)+value;
    data.stats[taskType]=(data.stats[taskType]||0)+value;
    this.saveSportsData(uid,data);
  },

  /* --- 游戏配置 --- */
  getGameConfig(){
    let c=this.get('dlp_game_config');
    if(!c){c=this.initGameConfig();}

    if(c.rules.sunlightToSeedlingRatio===undefined)c.rules.sunlightToSeedlingRatio=10;

    if(c.rules.potatoSellPrice===undefined)c.rules.potatoSellPrice=4;
    if(c.rules.peaSellPrice===undefined)c.rules.peaSellPrice=5;
    if(c.rules.cottonSellPrice===undefined)c.rules.cottonSellPrice=6;
    if(c.rules.clothSellPrice===undefined)c.rules.clothSellPrice=15;
    if(c.rules.gamePlayCost===undefined)c.rules.gamePlayCost=5;
    if(c.rules.gamePlayDailyLimit===undefined)c.rules.gamePlayDailyLimit=3;
    if(c.rules.gameWinReward===undefined)c.rules.gameWinReward=3;
    if(c.rules.cropProduceInterval===undefined)c.rules.cropProduceInterval=10800;
    if(c.rules.cropProduceAmount===undefined)c.rules.cropProduceAmount=10;

        cottonToClothRatio:2,streakDaysForMoneyTree:5,moneyTreeProduceInterval:600,
        moneyTreeProduceAmount:10,gridRows:3,gridCols:5,petHungerDecayPerHour:5,sunlightToSeedlingRatio:10,
        riceSellPrice:3,potatoSellPrice:4,peaSellPrice:5,cottonSellPrice:6,clothSellPrice:15,
        gamePlayCost:5,gamePlayDailyLimit:3,gameWinReward:3,
        cropProduceInterval:10800,cropProduceAmount:10,
        collectAllToolCost:50,weedAllToolCost:40,bugAllToolCost:40,healthDecayPerDay:50,

  /* --- 初始化 --- */
  initAll(){
    if(!this.get('dlp_users')){
      this.set('dlp_users',{users:[
        {id:'u_boy',name:'弟弟',avatar:'boy',grade:3,gender:'male',themeColor:'#4CAF50',createdAt:Date.now()},

  handleRoute(){
    const hash=(window.location.hash.slice(2)||'home').split('?')[0];
    const route=this.routes[hash]||this.routes['home'];
    const uid=App.DataStore.getCurrentUserId();
    const html=App.Renderer[route.render](uid,route.params||{});
    const container=document.getElementById('page-container');
    container.style.animation='none';
    container.offsetHeight;
    container.style.animation='fadeIn .3s ease-out';
    container.innerHTML=html;
    this.currentRoute=hash;
    App.Renderer.renderModuleNav();
    App.Renderer.afterRender(hash);
  }
};

  handleAvatarUpload(event){
    const file=event.target.files[0];
    if(!file)return;
    if(file.size>1024*1024){App.Utils.toast('图片不能超过1MB，请压缩后再上传','error');return;}
    const reader=new FileReader();
    reader.onload=(e)=>{
      const dataUrl=e.target.result;
      // 更新预览
      const preview=document.getElementById('avatar-preview');
      preview.innerHTML=`<div class="avatar-preview-img" style="background-image:url('${dataUrl}')"></div>`;
      // 存储到临时变量
      App.Renderer._pendingAvatarImage=dataUrl;
      // 取消 emoji 选择
      document.querySelectorAll('.avatar-option').forEach(o=>o.classList.remove('selected'));
      App.Utils.toast('图片已加载，点击保存生效','success');
    };
    reader.readAsDataURL(file);
  },
  clearAvatarImage(){
    App.Renderer._pendingAvatarImage=null;
    const preview=document.getElementById('avatar-preview');
    const user=App.DataStore.getCurrentUser();
    preview.innerHTML=`<div class="avatar-preview-emoji">${user.avatarEmoji||user.avatar==='girl'?'👧':'👦'}</div>`;

  selectAvatar(emoji){
    document.querySelectorAll('.avatar-option').forEach(o=>o.classList.remove('selected'));
    document.querySelector(`.avatar-option[data-emoji="${emoji}"]`).classList.add('selected');
    // 选择 emoji 时清除待上传图片
    App.Renderer._pendingAvatarImage=null;
    const preview=document.getElementById('avatar-preview');
    if(preview)preview.innerHTML=`<div class="avatar-preview-emoji">${emoji}</div>`;

  saveProfile(uid){
    const name=document.getElementById('edit-name').value.trim();
    const grade=parseInt(document.getElementById('edit-grade').value);
    const selected=document.querySelector('.avatar-option.selected');
    const avatarEmoji=selected?selected.dataset.emoji:null;
    const pendingImage=App.Renderer._pendingAvatarImage;
    if(!name){App.Utils.toast('请输入昵称','error');return;}
    const updates={name,grade};
    // 优先级：上传图片 > emoji 选择 > 清除
    if(pendingImage){
      updates.avatarImage=pendingImage;
      updates.avatarEmoji=null;
    }else if(avatarEmoji){
      updates.avatarEmoji=avatarEmoji;
      updates.avatarImage=null;  // 清除旧图片

    App.DataStore.updateUser(uid,updates);
    App.Renderer._pendingAvatarImage=null;

    App.Calendar.render();

App.Sync = {
  TOKEN_KEY:'dlp_sync_token', GIST_KEY:'dlp_sync_gistid', LAST_KEY:'dlp_sync_last', SYNC_FILE:'dlp_sync_meta.json',
  getToken(){return localStorage.getItem(this.TOKEN_KEY)||'';},
  setToken(t){ if(t&&t.trim()){localStorage.setItem(this.TOKEN_KEY,t.trim());} },
  getGistId(){return localStorage.getItem(this.GIST_KEY)||'';},
  setGistId(id){ if(id){localStorage.setItem(this.GIST_KEY,id);} else {localStorage.removeItem(this.GIST_KEY);} },
  statusText(){
    const id=this.getGistId(), last=localStorage.getItem(this.LAST_KEY);
    let s=this.getToken()?'已保存 Token；':'未保存 Token；';
    s+=id?('已连接云端(Gist '+id.slice(0,8)+'…)'):'未连接云端';
    if(last)s+='　上次：'+last;
    return s;
  },
  saveToken(){
    const v=document.getElementById('sync-token');
    if(!v||!v.value.trim()){App.Utils.toast('请输入 Token（留空不修改）','error');return;}
    this.setToken(v.value);
    App.Utils.toast('Token 已保存','success');
    const st=document.getElementById('sync-status'); if(st)st.textContent=this.statusText();
  },
  gather(){
    const all={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k.startsWith('dlp_')&&k!==this.TOKEN_KEY&&k!==this.GIST_KEY&&k!==this.LAST_KEY){
        try{all[k]=JSON.parse(localStorage.getItem(k));}catch(e){}
      }
    }
    return App.ParentPanel._stripBlobs(all);
  },
  async findGist(token){
    try{
      const r=await fetch('https://api.github.com/gists',{headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}});
      if(!r.ok)return null;
const list=await r.json();
    if(!Array.isArray(list))return null;
    // 多个含 meta 的 Gist 时，按更新时间倒序选最新的，避免挑到旧残留
    list.sort((a,b)=>(new Date(b.updated_at||0))-(new Date(a.updated_at||0)));
    for(const g of list){ if(g.files&&g.files[this.SYNC_FILE])return g.id; }
    return null;
    }catch(e){return null;}
  },
  CHUNK:750000, // 每个分片文件的字符数（base64 为 ASCII，1 字符=1 字节，远低于 Gist 1MB 限制）
  // 把整个数据对象压缩成 base64 字符串，再切成固定长度的字符串分片。
  // base64 全部是 ASCII，所以在任意字符边界切分都安全，不存在 UTF-8 字节被切断的问题。
  _encode(data){
    const raw=JSON.stringify(data);
    const body=LZString.compressToBase64(raw); // 始终输出 ASCII 安全的 base64
    const chunks=[];
    for(let i=0;i<body.length;i+=this.CHUNK) chunks.push(body.slice(i,i+this.CHUNK));
    return {rawLen:raw.length, bodyLen:body.length, chunks};
  },
  _decode(chunks){
    const full=chunks.join(''); // 重组只需字符串拼接，无结构重建
    const raw=LZString.decompressFromBase64(full);
    if(!raw) throw new Error('解压云端数据失败');
    return JSON.parse(raw);
  },
  async push(){
    const token=this.getToken();
    if(!token){App.Utils.toast('请先填写并保存 GitHub Token','error');return;}
    const data=this.gather();
    const {rawLen, bodyLen, chunks}=this._encode(data);
    const N=chunks.length;
    if(!N){App.Utils.toast('没有可同步的数据','error');return;}
    const files={};
    files[this.SYNC_FILE]={content:JSON.stringify({v:3, chunks:N, rawLen, bodyLen, ts:Date.now()})};
    const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/vnd.github+json'};
    let gistId=this.getGistId();
    if(!gistId){gistId=await this.findGist(token);if(gistId)this.setGistId(gistId);}
    // 列出旧 gist 中多余的分片文件，推送时设为 null 以删除（避免残留旧分片）
    if(gistId){
      try{
        const gr=await fetch('https://api.github.com/gists/'+gistId,{headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}});
        if(gr.ok){
          const gj=await gr.json();
          for(const f of Object.keys(gj.files||{})){
            const m=f.match(/^dlp_sync_(\d+)\.json$/);
            if(m&&parseInt(m[1],10)>=N) files[f]=null;
          }
        }
      }catch(e){}
    }
    for(let i=0;i<N;i++) files['dlp_sync_'+i+'.json']={content:chunks[i]};
    let url,method,bodyPayload;
    if(gistId){url='https://api.github.com/gists/'+gistId;method='PATCH';bodyPayload={files};}
    else{url='https://api.github.com/gists';method='POST';bodyPayload={description:'双娃学习打卡平台 云同步备份',public:false,files};}
    try{
      const resp=await fetch(url,{method:method,headers:headers,body:JSON.stringify(bodyPayload)});
      if(!resp.ok){const er=await resp.json().catch(()=>({}));App.Utils.toast('上传失败：'+(er.message||resp.status),'error');return;}
      const g=await resp.json();
      this.setGistId(g.id);
      localStorage.setItem(this.LAST_KEY,new Date().toLocaleString());
      const st=document.getElementById('sync-status');if(st)st.textContent=this.statusText();
      App.Utils.toast('已上传到云端 ☁️（'+N+' 个分片，'+Math.round(bodyLen/1024)+' KB）','success');
    }catch(err){App.Utils.toast('上传出错：'+err.message,'error');}
  },
  async pull(){
    const token=this.getToken();
    if(!token){App.Utils.toast('请先填写并保存 GitHub Token','error');return;}
    let gistId=this.getGistId();
    if(!gistId){gistId=await this.findGist(token);if(gistId)this.setGistId(gistId);}
    if(!gistId){App.Utils.toast('云端还没有备份，请先在一台设备上传','error');return;}
    try{
      const resp=await fetch('https://api.github.com/gists/'+gistId,{headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}});
      if(!resp.ok){App.Utils.toast('下载失败：'+resp.status,'error');return;}
      const g=await resp.json();
      const fileMap=g.files||{};
      const metaF=fileMap[this.SYNC_FILE];
      if(!metaF){App.Utils.toast('云端备份文件缺失','error');return;}
      let meta;
      try{meta=JSON.parse(metaF.content||'{}');}catch(e){App.Utils.toast('云端元数据损坏','error');return;}
      if(!meta||typeof meta.chunks!=='number'){App.Utils.toast('云端元数据损坏','error');return;}
      if(meta.v!==3){App.Utils.toast('提示：云端版本 v'+(meta.v||'?')+'，仍尝试解码恢复','info');}
      const parts=[];
      for(let i=0;i<meta.chunks;i++){
        const cf=fileMap['dlp_sync_'+i+'.json'];
        if(!cf||cf.content==null){App.Utils.toast('云端分片 '+i+' 缺失','error');return;}
        parts.push(cf.content||'');
      }
      const data=this._decode(parts);
      Object.keys(data).forEach(k=>{if(k.startsWith('dlp_'))localStorage.setItem(k,JSON.stringify(data[k]));});
      localStorage.setItem(this.LAST_KEY,new Date().toLocaleString());
      const st=document.getElementById('sync-status');if(st)st.textContent=this.statusText();
      App.Init.start();
      App.Utils.toast('已从云端恢复 ☁️','success');
    }catch(err){App.Utils.toast('下载出错：'+err.message,'error');}
  }
};

App.Calendar = {
  currentWeekStart:null,
  selectedDate:null,
  init(){
    const today=new Date();
    this.selectedDate=App.Utils.todayStr();
    this.currentWeekStart=this.getWeekStart(today);
    this.render();
  },
  getWeekStart(date){
    const d=new Date(date);const day=d.getDay()||7;
    d.setDate(d.getDate()-day+1);return d;
  },
  render(){
    const weekdayNames=['一','二','三','四','五','六','日'];
    const uid=App.DataStore.getCurrentUserId();
    const today=App.Utils.todayStr();
    let html='<button class="cal-nav" onclick="App.Calendar.prevWeek()">◀</button><div class="cal-days">';
    for(let i=0;i<7;i++){
      const d=new Date(this.currentWeekStart);d.setDate(d.getDate()+i);
      const ds=App.Utils.dateStr(d);
      const checkin=App.DataStore.getCheckinRecord(uid,ds);
      const hasRecord=checkin&&checkin.completedTasks>0;
      const isToday=ds===today;
      const isSelected=ds===this.selectedDate;
      html+=`<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''} ${hasRecord?'has-checkin':''}" onclick="App.Calendar.selectDate('${ds}')">
        <span class="cal-weekday">${weekdayNames[i]}</span><span class="cal-date">${d.getMonth()+1}/${d.getDate()}</span>${hasRecord?'<span class="cal-dot"></span>':''}
      </div>`;
    }
    html+='</div><button class="cal-nav" onclick="App.Calendar.nextWeek()">▶</button>';
    document.getElementById('calendar-bar').innerHTML=html;
  },
  selectDate(ds){
    this.selectedDate=ds;
    this.render();
    if(App.Router.currentRoute==='home'||['chinese','math','english','science'].includes(App.Router.currentRoute)){
      App.Router.handleRoute();
    }
  },
  prevWeek(){this.currentWeekStart.setDate(this.currentWeekStart.getDate()-7);this.render();},
  nextWeek(){this.currentWeekStart.setDate(this.currentWeekStart.getDate()+7);this.render();},
};

App.Tasks = {
  toggleTask(subject,taskTypeId,date){
    const uid=App.DataStore.getCurrentUserId();
    const checkin=App.DataStore.getOrCreateCheckin(uid,date);
    const idx=checkin.tasks.findIndex(t=>t.taskType===taskTypeId&&t.subject===subject);
    const defs=App.DataStore.getTaskDefs(uid);
    const typeDef=defs.subjects[subject].taskTypes.find(t=>t.typeId===taskTypeId);
    let wasCompleted=false;
    let nowCompleted=false;

    if(idx>=0){
      const task=checkin.tasks[idx];
      wasCompleted=task.status==='completed';
      if(task.status==='completed'){
        task.status='pending';task.completedAt=null;
        if(task.earnedSeedling){App.DataStore.addSeedling(uid,-1);task.earnedSeedling=false;}
      }else{
        task.status='completed';task.completedAt=Date.now();
        if(!task.earnedSeedling){App.DataStore.addSeedling(uid,1);task.earnedSeedling=true;}
        App.Utils.toast('任务完成！获得 🌱小苗 +1','success');
        nowCompleted=true;
      }
    }else{
      checkin.tasks.push({
        taskId:App.Utils.genId('task'),subject,taskType:taskTypeId,taskName:typeDef.name,
        status:'completed',completedAt:Date.now(),duration:typeDef.defaultDuration,note:'',earnedSeedling:true
      });
      App.DataStore.addSeedling(uid,1);
      App.Utils.toast('任务完成！获得 🌱小苗 +1','success');
      nowCompleted=true;
    }
    checkin.completedTasks=checkin.tasks.filter(t=>t.status==='completed').length;
    checkin.seedlingsEarned=checkin.tasks.filter(t=>t.earnedSeedling).length;
    App.DataStore.saveCheckin(uid,date,checkin);
    App.Farm.checkStreak(uid,date);
    App.Router.handleRoute();
    App.Calendar.render();
    App.Renderer.renderTopbar();
    // 运动打卡完成后弹出数据录入
    if(subject==='sports'&&nowCompleted){
      setTimeout(()=>{if(App.Sports)App.Sports.onTaskComplete(uid,taskTypeId,date);},300);
    }
  },
  openAddCustomDialog(subject){
    App.Renderer.openModal(`
      <h3>添加自定义任务</h3>
      <div class="form-group"><label>任务名称</label><input type="text" id="custom-task-name" placeholder="如：看课外书20页"></div>
      <div class="form-group"><label>建议时长（分钟）</label><input type="number" id="custom-task-duration" value="15"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="App.Renderer.closeModal()">取消</button>
        <button class="btn btn-primary" onclick="App.Tasks.saveCustomTask('${subject}')">添加</button>
      </div>
    `);
    setTimeout(()=>document.getElementById('custom-task-name')?.focus(),100);
  },
  saveCustomTask(subject){
    const name=document.getElementById('custom-task-name').value.trim();
    const duration=parseInt(document.getElementById('custom-task-duration').value)||15;
    if(!name){App.Utils.toast('请输入任务名称','error');return;}
    const uid=App.DataStore.getCurrentUserId();
    App.DataStore.addCustomTaskType(uid,subject,name,duration);
    App.Renderer.closeModal();
    App.Router.handleRoute();
    App.Utils.toast('自定义任务已添加','success');
  },
};

  // 大卡换算：跳绳0.1大卡/次, 跑步0.07大卡/米, 仰卧起坐0.05大卡/次, 拉伸3大卡/分钟, 球类7大卡/分钟
  calcCalories(stats){
    return Math.round((stats.rope_skip||0)*0.1+(stats.running||0)*0.07+(stats.situp||0)*0.05+(stats.stretching||0)*3+(stats.ballgame||0)*7);
  },
  // 计算运动连续天数
  calcSportsStreak(uid){
    const data=App.DataStore.getSportsData(uid);
    let streak=0;
    const today=new Date();
    for(let i=0;i<365;i++){
      const d=new Date(today);d.setDate(d.getDate()-i);
      const ds=App.Utils.dateStr(d);
      if(data.dailyLog[ds]&&Object.values(data.dailyLog[ds]).some(v=>v>0)){streak++;}
      else if(i>0){break;}
    }
    return streak;
  },

    const data=App.DataStore.getSportsData(uid);
    // 弹出输入运动数据对话框
    App.Renderer.openModal(`
      <h3>${cfg.icon} ${cfg.name}数据录入</h3>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">运动打卡成功！请输入本次运动量：</div>

    const val=parseInt(document.getElementById('sports-input-val').value)||0;
    if(val<=0){App.Utils.toast('请输入有效数值','error');return;}
    App.DataStore.recordSportsStats(uid,taskType,val);
    // 更新打卡计数和晨练计数
    const data=App.DataStore.getSportsData(uid);
    data.totalCheckins=(data.totalCheckins||0)+1;
    const hour=new Date().getHours();
    if(hour<7)data.earlyBirdCount=(data.earlyBirdCount||0)+1;
    // 更新运动连续天数
    data.sportsStreak=this.calcSportsStreak(uid);
    App.DataStore.saveSportsData(uid,data);
    App.Renderer.closeModal();
    // 检查成就解锁
    this.checkAchievements(uid);

  },

    const data=App.DataStore.getSportsData(uid);
    data.sportsStreak=this.calcSportsStreak(uid);
    const newlyUnlocked=[];
    this.achievementDefs.forEach(ach=>{
      if(!data.achievements.includes(ach.id)){
        if(ach.check(data)){
          data.achievements.push(ach.id);
          newlyUnlocked.push(ach);
        }
      }
    });
    App.DataStore.saveSportsData(uid,data);
    if(newlyUnlocked.length>0){
      newlyUnlocked.forEach(ach=>{
        setTimeout(()=>{
          App.Utils.toast(`🎉 成就解锁：${ach.icon} ${ach.name}！`,'success');
        },200);
      });
    }
  },
  // 渲染运动统计卡片
  renderStatsGrid(uid){
    const data=App.DataStore.getSportsData(uid);
    const today=App.Utils.todayStr();
    const todayData=data.dailyLog[today]||{};
    return `<div class="sports-stats-grid">${Object.entries(this.sportTypes).map(([id,cfg])=>{
      const todayVal=todayData[id]||0;
      const totalVal=data.stats[id]||0;
      return `<div class="stat-mini-card">
        <div class="stat-icon">${cfg.icon}</div>
        <div class="stat-num">${todayVal}</div>
        <div class="stat-label">${cfg.name}（${cfg.unit}）</div>
        <div style="font-size:10px;color:var(--text-light);margin-top:2px">累计 ${totalVal}</div>
      </div>`;
    }).join('')}</div>`;
  },
  // 渲染本周柱状图
  renderWeeklyChart(uid){
    const data=App.DataStore.getSportsData(uid);
    const days=[];
    const today=new Date();
    const weekdays=['日','一','二','三','四','五','六'];
    let maxVal=1;
    for(let i=6;i>=0;i--){
      const d=new Date(today);d.setDate(d.getDate()-i);
      const ds=App.Utils.dateStr(d);
      const dayData=data.dailyLog[ds]||{};
      const total=Object.values(dayData).reduce((a,b)=>a+(b||0),0);
      days.push({label:weekdays[d.getDay()],val:total,date:ds});
      if(total>maxVal)maxVal=total;
    }
    const bars=days.map(d=>{
      const h=Math.round((d.val/maxVal)*80);
      return `<div class="chart-bar-col">
        <div class="chart-bar-val">${d.val||''}</div>
        <div class="chart-bar" style="height:${h+4}px;background:var(--subj-sports);${d.date===App.Utils.dateStr(new Date())?'border:2px solid var(--mc-gold);':''}"></div>
        <div class="chart-bar-label">${d.label}</div>
      </div>`;
    }).join('');
    return `<div class="sports-chart">
      <div class="chart-title">📊 本周运动量</div>
      <div class="chart-bars">${bars}</div>
    </div>`;
  },
  // 渲染成就徽章墙
  renderAchievementWall(uid){
    const data=App.DataStore.getSportsData(uid);
    const unlocked=data.achievements||[];
    const calories=this.calcCalories(data.stats);
    const badges=this.achievementDefs.map(ach=>{
      const isUnlocked=unlocked.includes(ach.id);
      return `<div class="achievement-badge ${isUnlocked?'unlocked':'locked'}" title="${ach.desc}">
        <div class="badge-icon">${ach.icon}</div>
        <div class="badge-name">${ach.name}</div>
        <div class="badge-desc">${isUnlocked?'✅ 已解锁':ach.desc}</div>
      </div>`;
    }).join('');
    const progress=`已解锁 ${unlocked.length}/${this.achievementDefs.length}`;
    return `<div class="achievement-wall">
      <div class="chart-title">🏅 成就徽章墙 <span style="font-size:12px;color:var(--text-secondary);font-weight:normal">${progress} · 累计消耗 ${calories} 大卡</span></div>
      <div class="achievement-grid">${badges}</div>
    </div>`;
  },
};

    document.getElementById('q-options-group').style.display=type==='choice'?'block':'none';
  },
  saveQuestion(){
    const lessonId=document.getElementById('q-lesson').value;
    const type=document.getElementById('q-type').value;
    const difficulty=parseInt(document.getElementById('q-difficulty').value);
    const content=document.getElementById('q-content').value.trim();
    const answer=document.getElementById('q-answer').value.trim();
    if(!content||!answer){App.Utils.toast('请填写题目内容和答案','error');return;}
    const options=[];
    if(type==='choice'){
      ['a','b','c','d'].forEach(l=>{const v=document.getElementById('q-opt-'+l).value.trim();if(v)options.push(v);});
    }
    const bank=App.DataStore.getQuestionBank();
    let lesson=null;
    for(const s of Object.values(bank.subjects)){
      const l=s.lessons.find(x=>x.lessonId===lessonId);
      if(l){lesson=l;break;}
    }
    if(!lesson){App.Utils.toast('课文未找到','error');return;}
    lesson.questions.push({
      questionId:App.Utils.genId('q'),type,difficulty,content,
      options:options.length>0?options:undefined,answer,
      explanation:document.getElementById('q-explanation').value.trim()||undefined,
      createdAt:Date.now(),updatedAt:Date.now()
    });
    App.DataStore.saveQuestionBank(bank);
    App.Renderer.closeModal();
    this.renderLessons();

  doImport(){

      else if(fmt==='csv'){questions=this.parseCsvImport(txt);}
      else if(fmt==='tsv'){questions=this.parseTsvImport(txt);}
      else if(fmt==='text'){questions=this.parseTextImport(txt);}
      else{App.Utils.toast('未知格式','error');return;}
    }catch(e){App.Utils.toast('解析失败: '+e.message,'error');return;}

  /* JSON 格式解析 */
  parseJsonImport(txt){
    const data=JSON.parse(txt);
    if(!Array.isArray(data))throw new Error('JSON 必须是数组');
    return data.map(item=>({
      subject:item.subject,grade:item.grade,lessonNumber:item.lessonNumber,
      lessonTitle:item.lessonTitle,type:item.type||'choice',difficulty:item.difficulty||1,
      content:item.content,options:item.options,answer:item.answer,
      explanation:item.explanation,tags:item.tags
    }));
  },
  /* CSV 格式解析 */
  parseCsvImport(txt){
    const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length===0)return [];
    // 检测是否有表头行
    const firstFields=this.parseCsvLine(lines[0]);
    const hasHeader=firstFields[0]==='题型'||firstFields[0].toLowerCase()==='type';
    const start=hasHeader?1:0;
    const result=[];
    for(let i=start;i<lines.length;i++){
      const f=this.parseCsvLine(lines[i]);
      if(f.length<3)continue;
      const type=(f[0]||'fill').trim().toLowerCase();
      const difficulty=parseInt(f[1])||1;
      const content=f[2];
      const answer=f[7]||f[f.length-1];
      const explanation=f[8]||'';
      const options=[];
      if(type==='choice'||type==='select'){
        for(let j=3;j<7&&j<f.length-2;j++){if(f[j])options.push(f[j]);}
      }
      result.push({type,difficulty,content,options:options.length>0?options:undefined,answer,explanation});
    }
    return result;
  },
  parseCsvLine(line){
    const result=[];let cur='';let inQuote=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){
        if(inQuote&&line[i+1]==='"'){cur+='"';i++;}
        else{inQuote=!inQuote;}
      }else if(ch===','&&!inQuote){result.push(cur);cur='';}
      else{cur+=ch;}
    }
    result.push(cur);
    return result.map(s=>s.trim());
  },
  /* TSV 格式解析（Tab分隔） */
  parseTsvImport(txt){
    const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length===0)return [];
    const firstFields=lines[0].split('\t');
    const hasHeader=firstFields[0]==='题型'||firstFields[0].toLowerCase()==='type';
    const start=hasHeader?1:0;
    const result=[];
    for(let i=start;i<lines.length;i++){
      const f=lines[i].split('\t').map(s=>s.trim());
      if(f.length<3)continue;
      const type=(f[0]||'fill').trim().toLowerCase();
      const difficulty=parseInt(f[1])||1;
      const content=f[2];
      const answer=f[7]||'';
      const explanation=f[8]||'';
      const options=[];
      if(type==='choice'||type==='select'){
        for(let j=3;j<7&&j<f.length;j++){if(f[j])options.push(f[j]);}
      }
      result.push({type,difficulty,content,options:options.length>0?options:undefined,answer,explanation});
    }
    return result;
  },
  /* 纯文本逐行解析 */
  parseTextImport(txt){
    const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    const result=[];
    for(const line of lines){
      const typeChar=line.charAt(0).toUpperCase();
      const rest=line.slice(1).trim();
      let type='fill',parts;
      if(typeChar==='Q'){type='choice';parts=this.splitTextFields(rest);}
      else if(typeChar==='F'){type='fill';parts=this.splitTextFields(rest);}
      else if(typeChar==='J'){type='judge';parts=this.splitTextFields(rest);}
      else if(typeChar==='S'){type='short_answer';parts=this.splitTextFields(rest);}
      else{
        // 无前缀，默认填空，整行作为题目，但需要至少两个字段
        parts=this.splitTextFields(line);
        type='fill';
      }
      if(parts.length<2)continue;
      const content=parts[0];
      let answer='',options,explanation='';
      if(type==='choice'){
        // 格式: Q 题目 选项A 选项B 选项C 选项D 答案 [解析]
        // 最后一个字段是答案，倒数第二个是解析（可选），其余是选项
        answer=parts[parts.length-1]||'';
        // 检查倒数第二个是否为解析（非选项格式，即不以A./B./C./D.开头）
        const secondLast=parts[parts.length-2]||'';
        const optionPattern=/^[A-Da-d][.．、)]/;
        if(parts.length>3&&!optionPattern.test(secondLast)){
          explanation=secondLast;
          options=parts.slice(1,parts.length-2);
        }else{
          options=parts.slice(1,parts.length-1);
        }
        options=options.filter(o=>o);
      }else if(type==='judge'){
        answer=answer==='对'||answer==='正确'||answer==='T'||answer==='true'||answer==='√'?'对':'错';
        // 判断题可能有解析
        if(parts.length>2){explanation=parts[2];}
        answer=parts[1]==='对'||parts[1]==='正确'||parts[1]==='T'||parts[1]==='true'||parts[1]==='√'?'对':'错';
      }else{
        // fill / short_answer: 题目 答案 [解析]
        answer=parts[1]||'';
        if(parts.length>2){explanation=parts[2];}
      }
      result.push({type,difficulty:1,content,options:options&&options.length>0?options:undefined,answer,explanation});
    }
    return result;
  },
  /* 智能分割字段：支持空格、全角空格、方括号包裹 */
  splitTextFields(str){
    const fields=[];let cur='';let inBracket=false;
    for(let i=0;i<str.length;i++){
      const ch=str[i];
      if(ch==='['){inBracket=true;cur='';}
      else if(ch===']'){fields.push(cur);cur='';inBracket=false;}
      else if(!inBracket&&(ch===' '||ch==='\u3000')){
        if(cur){fields.push(cur);cur='';}
      }else{cur+=ch;}
    }
    if(cur)fields.push(cur);
    return fields;
  },

    const source=subj.lessons.find(l=>l.lessonId===sourceId);
    if(!source){App.Utils.toast('源课文未找到','error');return;}
    const target=App.DataStore.findOrCreateLesson(bank,this.currentSubject,grade,number,title||source.lessonTitle);
    source.questions.forEach(q=>{
      target.questions.push({...q,questionId:App.Utils.genId('q'),createdAt:Date.now(),updatedAt:Date.now()});
    });
    App.DataStore.saveQuestionBank(bank);
    App.Renderer.closeModal();
    this.renderLessons();
    App.Utils.toast(`已复制 ${source.questions.length} 道题目到新课文`,'success');
  },
  /* 快速填空生成：输入一段课文，自动按句号分割生成填空题 */
  openQuickFillDialog(){
    if(!App.ParentPanel.checkAuth()){App.ParentPanel.showLoginDialog();return;}
    const bank=App.DataStore.getQuestionBank();
    const subj=bank.subjects[this.currentSubject];
    if(!subj||subj.lessons.length===0){App.Utils.toast('请先新增课文','error');return;}
    App.Renderer.openModal(`
      <h3>⚡ 快速填空生成</h3>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;line-height:1.6">
        粘贴一段课文内容，系统自动按句号/问号分割，<br>
        每句的最后一个词作为填空答案（自动截取最后2-4字）。<br>
        <span style="color:var(--mc-grass-dark)">示例：白日依山尽，黄河入海流。→ 题目"白日依山尽，黄河入____"，答案"海流"</span>
      </div>
      <div class="form-group"><label>课文</label><select id="qf-lesson">${subj.lessons.map(l=>`<option value="${l.lessonId}">${l.grade}年级 第${l.lessonNumber}课 ${l.lessonTitle}</option>`).join('')}</select></div>
      <div class="form-group"><label>课文内容</label><textarea id="qf-content" rows="8" placeholder="粘贴课文内容，每句以句号或问号结尾..."></textarea></div>
      <div class="form-group"><label>填空字数</label><select id="qf-len"><option value="2">2字</option><option value="3" selected>3字</option><option value="4">4字</option></select></div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="App.Renderer.closeModal()">取消</button><button class="btn btn-primary" onclick="App.QuestionBank.saveQuickFill()">生成</button></div>
    `);
  },
  saveQuickFill(){
    const lessonId=document.getElementById('qf-lesson').value;
    const content=document.getElementById('qf-content').value.trim();
    const fillLen=parseInt(document.getElementById('qf-len').value);
    if(!content){App.Utils.toast('请输入课文内容','error');return;}
    const sentences=content.split(/[。？！!?]/).map(s=>s.trim()).filter(s=>s.length>fillLen+2);
    if(sentences.length===0){App.Utils.toast('未找到足够长的句子','error');return;}
    const bank=App.DataStore.getQuestionBank();
    let lesson=null;
    for(const s of Object.values(bank.subjects)){
      const l=s.lessons.find(x=>x.lessonId===lessonId);
      if(l){lesson=l;break;}
    }
    if(!lesson){App.Utils.toast('课文未找到','error');return;}
    let count=0;
    sentences.forEach(sent=>{
      const answer=sent.slice(-fillLen);
      const questionContent=sent.slice(0,-fillLen)+'____';
      lesson.questions.push({
        questionId:App.Utils.genId('q'),type:'fill',difficulty:1,
        content:questionContent,answer,
        createdAt:Date.now(),updatedAt:Date.now()
      });
      count++;
    });
    App.DataStore.saveQuestionBank(bank);
    App.Renderer.closeModal();
    this.renderLessons();
    App.Utils.toast(`成功生成 ${count} 道填空题`,'success');
  },
  /* 导出当前学科的题目为 JSON */
  exportSubject(){
    const bank=App.DataStore.getQuestionBank();
    const subj=bank.subjects[this.currentSubject];
    if(!subj||subj.lessons.length===0){App.Utils.toast('当前学科无课文可导出','error');return;}
    const exportData=subj.lessons.map(l=>({
      subject:this.currentSubject,grade:l.grade,lessonNumber:l.lessonNumber,
      lessonTitle:l.lessonTitle,questions:l.questions.map(q=>({
        type:q.type,difficulty:q.difficulty,content:q.content,
        options:q.options,answer:q.answer,explanation:q.explanation
      }))
    }));
    const blob=new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=this.currentSubject+'_export_'+App.Utils.todayStr()+'.json';a.click();
    URL.revokeObjectURL(url);
    App.Utils.toast('已导出 '+subj.lessons.length+' 篇课文','success');
  },
};

                  <div class="kb-point-item" onclick="event.stopPropagation();App.Knowledge.showPointCard('${p.pointId}')" style="cursor:pointer">

  },
  showPointCard(pid){

  /* ---------- 搜索 ---------- */
  doSearch(){
    const input=document.getElementById('kb-search-input');
    if(!input)return;
    const query=input.value.trim().toLowerCase();
    const rc=document.getElementById('kb-result-count');
    const container=document.getElementById('kb-lesson-list');
    if(!container)return;
    if(!query){
      rc.style.display='none';
      this.renderLessons();
      return;
    }
    const bank=App.DataStore.getKnowledgeBase();
    const results=[];
    Object.entries(bank.subjects).forEach(([sk,s])=>{
      s.lessons.forEach(l=>{
        l.points.forEach(p=>{
          const inTitle=p.title.toLowerCase().includes(query);
          const inContent=p.content.toLowerCase().includes(query);
          if(inTitle||inContent){
            results.push({subjectKey:sk,subjectName:s.name,textbook:s.textbook,lesson:l,point:p});
          }
        });
      });
    });
    rc.style.display='block';
    rc.innerHTML=`🔍 找到 <b>${results.length}</b> 个匹配知识点（关键词："${App.Utils.escape(query)}"）`;
    if(results.length===0){
      container.innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div>未找到匹配的知识点</div>';
      return;
    }
    /* 按学科+课文分组 */
    const groupMap={};
    results.forEach(r=>{
      const key=r.subjectKey+'_'+r.lesson.lessonId;
      if(!groupMap[key])groupMap[key]={subjectName:r.subjectName,textbook:r.textbook,lesson:r.lesson,points:[]};
      groupMap[key].points.push(r.point);
    });
    container.innerHTML=Object.values(groupMap).map(g=>`
      <div class="kb-search-result-group">
        <div class="kb-search-result-path">📖 ${g.subjectName}（${g.textbook}）› ${g.lesson.grade}年级 第${g.lesson.lessonNumber}课 ${App.Utils.escape(g.lesson.lessonTitle)}</div>
        ${g.points.map(p=>`
          <div class="kb-point-item" onclick="App.Knowledge.showPointCard('${p.pointId}')" style="cursor:pointer">
            <div class="kb-point-title">${this.highlightText(p.title,query)}</div>
            <div class="kb-point-content">${this.highlightText(p.content,query)}</div>
            ${p.tags?`<div class="kb-point-tags">${p.tags.split(/[,，]/).filter(Boolean).map(t=>`<span class="kb-point-tag">${App.Utils.escape(t.trim())}</span>`).join('')}</div>`:''}
          </div>`).join('')
        }
      </div>
    `).join('');
  },
  clearSearch(){
    const input=document.getElementById('kb-search-input');
    if(input)input.value='';
    const rc=document.getElementById('kb-result-count');
    if(rc)rc.style.display='none';
    this.renderLessons();
  },
  highlightText(text,query){
    if(!query)return App.Utils.escape(text);
    const escaped=App.Utils.escape(text);
    try{
      const regex=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
      return escaped.replace(regex,'<span class="highlight">$1</span>');
    }catch(e){return escaped;}
  },
